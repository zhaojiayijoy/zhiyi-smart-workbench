<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlowMind Office AI · M0 交互原型</title>
<style>
  :root{
    --bg:#fafafa; --panel:#ffffff; --panel-2:#f6f6f8;
    --line:#e8e8ec; --line-strong:#dcdce2;
    --text:#1c1c1f; --text-2:#5b5b66; --text-3:#8c8c99;
    --accent:#5e6ad2; --accent-soft:#eef0fc; --accent-line:#c9cdf3;
    --ok:#2f9e5f; --ok-soft:#eaf6ee;
    --warn:#b7791f; --warn-soft:#fdf4e3;
    --err:#c2413a; --err-soft:#fdeceb;
    --radius:10px;
    --shadow:0 1px 2px rgba(16,16,24,.04), 0 8px 24px rgba(16,16,24,.04);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;font-size:13px;cursor:pointer}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d9d9e0;border-radius:8px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- shell ---------- */
  .app{display:grid;grid-template-columns:236px minmax(0,1fr) 344px;height:100vh;overflow:hidden}
  .app.panel-collapsed{grid-template-columns:236px minmax(0,1fr) 0}

  /* ---------- sidebar ---------- */
  .sidebar{background:var(--panel-2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .brand{display:flex;align-items:center;gap:9px;padding:16px 16px 12px}
  .mark{width:24px;height:24px;border-radius:7px;background:linear-gradient(150deg,#6f7be8,#4b56b8);display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;letter-spacing:-.3px}
  .brand-name{font-weight:600;font-size:13.5px;letter-spacing:-.1px}
  .brand-sub{font-size:10.5px;color:var(--text-3);margin-top:-3px}
  .nav{flex:1;overflow:auto;padding:4px 8px 12px}
  .nav-label{font-size:10.5px;letter-spacing:.09em;color:var(--text-3);padding:14px 8px 6px;font-weight:600}
  .nav-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;color:var(--text-2);cursor:pointer;user-select:none;transition:background .12s,color .12s}
  .nav-item:hover{background:#ececf1;color:var(--text)}
  .nav-item.active{background:#e6e7ef;color:var(--text);font-weight:550}
  .nav-item svg{width:15px;height:15px;flex:0 0 15px;stroke-width:1.7;opacity:.8}
  .nav-item .badge{margin-left:auto;font-size:10px;background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:20px;font-weight:600}
  .side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:9px}
  .avatar{width:24px;height:24px;border-radius:50%;background:#dfe1f5;color:#3d4694;display:grid;place-items:center;font-size:10.5px;font-weight:700}

  /* ---------- topbar ---------- */
  .main{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--bg)}
  .topbar{height:46px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);flex:0 0 46px}
  .crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-3)}
  .crumb b{color:var(--text);font-weight:550}
  .crumb svg{width:12px;height:12px;opacity:.5}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .icon-btn{width:28px;height:28px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--text-2);display:grid;place-items:center}
  .icon-btn:hover{background:#efeff3;border-color:var(--line)}
  .icon-btn svg{width:15px;height:15px}

  .scroll{flex:1;overflow:auto;min-height:0}
  .view{padding:22px 24px 60px;max-width:1080px;margin:0 auto}
  .view[hidden]{display:none}

  /* ---------- generic ---------- */
  h1{font-size:20px;letter-spacing:-.3px;margin:0 0 4px;font-weight:600}
  h2{font-size:14px;margin:0 0 2px;font-weight:600;letter-spacing:-.1px}
  .sub{color:var(--text-3);font-size:12px;margin:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .card-h .right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .card-b{padding:14px}
  .row{display:flex;gap:10px}
  .muted{color:var(--text-3)}
  .mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .btn{border:1px solid var(--line-strong);background:#fff;color:var(--text);padding:5px 11px;border-radius:7px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:.12s}
  .btn:hover{background:#f5f5f7;border-color:#cfcfd8}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(94,106,210,.3)}
  .btn.primary:hover{background:#4f5bc4}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
  .btn.ghost:hover{background:#efeff3;color:var(--text)}
  .btn.sm{padding:3px 8px;font-size:12px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn svg{width:13px;height:13px}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--text-2);font-weight:500}
  .tag.ok{background:var(--ok-soft);border-color:#cde8d7;color:#227a4a}
  .tag.warn{background:var(--warn-soft);border-color:#f0dfb8;color:#8a5a12}
  .tag.err{background:var(--err-soft);border-color:#f3cdcb;color:#a13a34}
  .tag.acc{background:var(--accent-soft);border-color:var(--accent-line);color:#414cab}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
  .kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:1px 4px;color:var(--text-3);background:#fff}

  /* ---------- home ---------- */
  .hero{padding:34px 30px 28px;border-radius:14px;border:1px solid var(--line);background:
      radial-gradient(120% 140% at 0% 0%, #f2f3fd 0%, #ffffff 46%, #ffffff 100%);
      box-shadow:var(--shadow);margin-bottom:16px}
  .hero h1{font-size:23px;letter-spacing:-.5px}
  .hero p{color:var(--text-2);margin:6px 0 16px;font-size:13px;max-width:560px}
  .prompt{background:#fff;border:1px solid var(--line-strong);border-radius:11px;padding:10px 12px;box-shadow:0 2px 6px rgba(16,16,24,.04)}
  .prompt:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px rgba(94,106,210,.1)}
  .prompt textarea{width:100%;border:0;outline:0;resize:none;font-family:inherit;font-size:13px;color:var(--text);line-height:1.6;background:transparent;min-height:44px}
  .prompt-bar{display:flex;align-items:center;gap:8px;margin-top:4px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .chip{border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:20px;padding:4px 10px;font-size:11.5px;color:var(--text-2);display:inline-flex;gap:5px;align-items:center;transition:.12s}
  .chip:hover{border-color:var(--accent-line);color:var(--accent);background:#fff}
  .chip svg{width:12px;height:12px;opacity:.75}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .list-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f1f4}
  .list-item:last-child{border-bottom:0;padding-bottom:0}
  .list-item:first-child{padding-top:0}
  .fi{width:26px;height:26px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 26px}
  .fi svg{width:13px;height:13px;color:var(--text-2)}
  .li-t{font-size:12.5px;font-weight:520}
  .li-s{font-size:11px;color:var(--text-3)}

  /* ---------- steps ---------- */
  .steps{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:0 0 14px;padding:8px 10px;border:1px solid var(--line);background:#fff;border-radius:9px}
  .st{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);padding:3px 7px;border-radius:6px;white-space:nowrap}
  .st i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-size:9px;font-style:normal;background:#fff;color:var(--text-3)}
  .st.done{color:var(--text-2)}
  .st.done i{background:var(--ok);border-color:var(--ok);color:#fff}
  .st.cur{background:var(--accent-soft);color:#3d47a8;font-weight:600}
  .st.cur i{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 3px rgba(94,106,210,.14)}
  .st-sep{width:10px;height:1px;background:var(--line-strong)}

  /* ---------- files ---------- */
  .drop{border:1.5px dashed #d6d6df;border-radius:11px;background:#fff;padding:22px;text-align:center;transition:.15s;cursor:pointer}
  .drop:hover{border-color:var(--accent-line);background:#fcfcff}
  .drop svg{width:22px;height:22px;color:var(--text-3);margin-bottom:6px}
  .files{display:flex;flex-direction:column;gap:0}
  .file-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #f1f1f4}
  .file-row:last-child{border-bottom:0}
  .ftag{font-size:9.5px;font-weight:700;letter-spacing:.03em;padding:2px 5px;border-radius:4px;background:#eaf6ee;color:#227a4a;border:1px solid #cde8d7}
  .ftag.csv{background:#fdf4e3;color:#8a5a12;border-color:#f0dfb8}

  /* ---------- table ---------- */
  .tbl-wrap{overflow:auto;max-height:340px;border-top:1px solid var(--line)}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
  th{position:sticky;top:0;z-index:2;background:#fbfbfc;text-align:left;font-weight:600;font-size:11px;color:var(--text-2);padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th .ty{font-weight:500;color:var(--text-3);font-size:10px;margin-left:5px}
  td{padding:6px 10px;border-bottom:1px solid #f4f4f6;white-space:nowrap;font-variant-numeric:tabular-nums}
  tbody tr:hover td{background:#fafaff}
  td.dirty{background:#fdf7ec}
  td.bad{background:#fdeeed;color:#a13a34}
  td.null{color:#b9b9c4;font-style:italic}
  .pager{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--text-3)}
  .pager .right{margin-left:auto;display:flex;gap:4px}

  /* ---------- quality ---------- */
  .qbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
  .qcell{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff}
  .qcell .n{font-size:18px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
  .qcell .l{font-size:11px;color:var(--text-3)}
  .qcell.bad .n{color:var(--err)}
  .qcell.warn .n{color:var(--warn)}
  .colq{width:100%;font-size:11.5px}
  .colq td{padding:5px 8px;white-space:nowrap}
  .meter{height:4px;border-radius:3px;background:#eeeef2;overflow:hidden;min-width:44px}
  .meter > span{display:block;height:100%;background:var(--warn)}
  .meter > span.ok{background:var(--ok)}
  .meter > span.bad{background:var(--err)}

  /* ---------- plan / confirm ---------- */
  .plan{display:flex;flex-direction:column;gap:0}
  .pstep{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f2f2f5}
  .pstep:last-child{border-bottom:0}
  .pstep .idx{width:19px;height:19px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--text-2);flex:0 0 19px;margin-top:1px}
  .pstep.confirm .idx{background:var(--warn-soft);border-color:#f0dfb8;color:#8a5a12}
  .pstep .op{font-size:12.5px;font-weight:550}
  .pstep .pp{font-size:11px;color:var(--text-3);font-family:ui-monospace,Menlo,monospace;margin-top:1px;white-space:normal;word-break:break-word}
  .pstep .r{margin-left:auto;text-align:right}
  .pstep .res{font-size:11px;color:var(--ok);font-weight:600;white-space:nowrap}
  .pstep .res.run{color:var(--accent)}
  .spinner{width:11px;height:11px;border-radius:50%;border:1.5px solid #d5d8f5;border-top-color:var(--accent);animation:spin .7s linear infinite;display:inline-block;vertical-align:-1px}
  @keyframes spin{to{transform:rotate(360deg)}}

  .field{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f2f2f5}
  .field:last-child{border-bottom:0}
  .field label{width:88px;flex:0 0 88px;font-size:12px;color:var(--text-2)}
  .field .hint{font-size:10.5px;color:var(--text-3);margin-left:auto;text-align:right}
  select,input[type=text]{font-family:inherit;font-size:12px;border:1px solid var(--line-strong);border-radius:6px;padding:4px 7px;background:#fff;color:var(--text);outline:0}
  select:focus,input[type=text]:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px rgba(94,106,210,.1)}

  /* ---------- checks ---------- */
  .check{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid #f2f2f5;font-size:12px}
  .check:last-child{border-bottom:0}
  .check .nm{font-weight:520}
  .check .vals{color:var(--text-3);font-size:11px;font-variant-numeric:tabular-nums}
  .check .r{margin-left:auto}

  /* ---------- right panel ---------- */
  .panel{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
  .app.panel-collapsed .panel{display:none}
  .panel-h{height:46px;flex:0 0 46px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px}
  .tabs{display:flex;gap:2px;background:var(--panel-2);padding:2px;border-radius:7px}
  .tabs button{border:0;background:transparent;padding:3px 9px;border-radius:5px;font-size:11.5px;color:var(--text-2)}
  .tabs button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06);font-weight:550}
  .panel-b{flex:1;overflow:auto;padding:14px}
  .panel-sec{margin-bottom:18px}
  .panel-sec h3{font-size:11px;letter-spacing:.06em;color:var(--text-3);margin:0 0 8px;font-weight:650}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:3px 0}
  .kv .k{color:var(--text-3)}
  .kv .v{font-variant-numeric:tabular-nums;text-align:right}

  /* ---------- chat ---------- */
  .chat{display:flex;flex-direction:column;height:100%;min-height:0}
  .msgs{flex:1;overflow:auto;padding:18px 22px 8px;display:flex;flex-direction:column;gap:14px}
  .msg{display:flex;gap:10px;max-width:760px}
  .msg .who{width:22px;height:22px;border-radius:6px;flex:0 0 22px;display:grid;place-items:center;font-size:10px;font-weight:700}
  .msg.ai .who{background:var(--accent-soft);color:#414cab;border:1px solid var(--accent-line)}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg.me .who{background:#1c1c1f;color:#fff}
  .msg .bubble{font-size:12.5px;color:var(--text);line-height:1.65}
  .msg.me .bubble{background:var(--panel-2);border:1px solid var(--line);padding:7px 11px;border-radius:9px}
  .composer{border-top:1px solid var(--line);padding:12px 18px 14px;background:#fff}
  .composer .prompt{padding:8px 10px}
  .composer textarea{min-height:20px;max-height:120px;font-size:12.5px}

  /* ---------- toast ---------- */
  .toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
  .toast{background:#1c1c1f;color:#fff;font-size:12px;padding:8px 12px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;gap:8px;align-items:center;animation:tin .2s ease-out;max-width:340px}
  .toast .dot{color:#8fe0ad}
  .toast.warn .dot{color:#ffd479}
  @keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .empty{text-align:center;padding:34px 20px;color:var(--text-3);font-size:12px}
  .empty svg{width:26px;height:26px;opacity:.5;margin-bottom:8px}
  .callout{display:flex;gap:9px;padding:9px 11px;border-radius:8px;background:var(--warn-soft);border:1px solid #f0dfb8;color:#7a5210;font-size:11.5px;line-height:1.55}
  .callout.acc{background:var(--accent-soft);border-color:var(--accent-line);color:#3d47a8}
  .callout svg{width:14px;height:14px;flex:0 0 14px;margin-top:1px}
  .hr{height:1px;background:var(--line);margin:12px 0}
  .fadein{animation:fi .18s ease-out}
  @keyframes fi{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">FM</div>
      <div>
        <div class="brand-name">FlowMind</div>
        <div class="brand-sub">Office AI · M0</div>
      </div>
    </div>
    <nav class="nav">
      <div class="nav-label">WORKSPACE</div>
      <div class="nav-item active" data-view="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg>
        <span>Home</span>
      </div>
      <div class="nav-item" data-view="ai">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M18 16.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>
        <span>AI Assistant</span>
      </div>
      <div class="nav-item" data-view="excel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9.5h18M9.5 9.5V20"/></svg>
        <span>Excel Workspace</span>
        <span class="badge">P0</span>
      </div>
      <div class="nav-item" data-view="analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19V9M10 19V5M16 19v-6M22 19H2"/></svg>
        <span>Data Analytics</span>
      </div>
      <div class="nav-item" data-view="report">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>
        <span>Report Studio</span>
      </div>
      <div class="nav-label">MANAGEMENT</div>
      <div class="nav-item" data-view="projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 7h6l2 2h10v11H3z"/></svg>
        <span>Projects</span>
      </div>
      <div class="nav-item" data-view="files">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h7l2 2h7v10H4z"/><path d="M4 7V5h6l2 2"/></svg>
        <span>Files</span>
      </div>
      <div class="nav-item" data-view="tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>Tasks</span>
      </div>
      <div class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg>
        <span>Settings</span>
      </div>
    </nav>
    <div class="side-foot">
      <div class="avatar">ZL</div>
      <div style="min-width:0">
        <div class="li-t" style="font-size:12px">张琳</div>
        <div class="li-s">本地工作区 · 单租户</div>
      </div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="crumb" id="crumb">
        <b>Home</b>
      </div>
      <div class="top-right">
        <span class="tag" id="ctxTag"><span class="dot" style="color:var(--ok)"></span>原型模式 · 本地数据</span>
        <button class="icon-btn" id="panelBtn" title="收起/展开右侧面板">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
        </button>
      </div>
    </div>
    <div class="scroll" id="scroll">
      <div class="view" id="view-home"></div>
      <div class="view" id="view-excel" hidden></div>
      <div class="view" id="view-ai" hidden style="padding:0;max-width:none;height:100%"></div>
      <div class="view" id="view-generic" hidden></div>
    </div>
  </div>

  <aside class="panel">
    <div class="panel-h">
      <div class="tabs" id="panelTabs">
        <button class="on" data-ptab="ctx">上下文</button>
        <button data-ptab="plan">计划</button>
        <button data-ptab="log">日志</button>
      </div>
      <span class="tag" id="panelVersion" style="margin-left:auto">v1</span>
    </div>
    <div class="panel-b" id="panelBody"></div>
  </aside>
</div>
<div class="toasts" id="toasts"></div>
<script>
/* ===== FlowMind M0 prototype ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = n => (n * 100).toFixed(1) + '%';
const sum = arr => arr.reduce((a, b) => a + b, 0);
const r2 = n => Math.round(n * 100) / 100;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- mock source data ---------- */
const REGIONS = ['华东', '华南', '华北', '西南', '华中'];
const rand = mulberry32(20241109);

function buildRows(){
  const rows = [];
  let seq = 0;
  const push = (file, sheet, line, order, date, region, amount, amountIsText, headerVariant) => {
    rows.push({ id: ++seq, file, sheet, line, order, date, region, amount, amountIsText, headerVariant });
  };
  // 文件一：xlsx，日期格式混杂
  for (let i = 1; i <= 22; i++){
    const d = ((i % 28) + 1);
    const fmt = i % 4;
    const date = fmt === 0 ? `2024-01-${String(d).padStart(2, '0')}`
      : fmt === 1 ? `2024/1/${d}`
      : fmt === 2 ? `2024年1月${d}日`
      : `202401${String(d).padStart(2, '0')}`;
    push('sales_2024_01.xlsx', 'Sheet1', i + 1, 'SO' + (20240100 + i), date, REGIONS[i % 3], r2(180 + rand() * 1200), false, 'std');
  }
  // 文件二：xlsx，含隐藏工作表；前 8 行为跨文件重复订单
  for (let i = 1; i <= 18; i++){
    const isDup = i <= 8;
    const order = isDup ? 'SO' + (20240100 + i) : 'SO' + (20240200 + i);
    const date = isDup ? `2024-02-${String(i + 2).padStart(2, '0')}` : `2024-02-${String(i + 6).padStart(2, '0')}`;
    const region = (i === 5 || i === 13) ? '' : REGIONS[(i + 1) % 5];
    push('sales_2024_02.xlsx', '销售明细', i + 1, order, date, region, r2(240 + rand() * 1500), false, 'std');
  }
  // 文件三：csv（GBK），表头不同，金额带货币符号
  for (let i = 1; i <= 16; i++){
    const isDup = i <= 5;
    const order = isDup ? 'SO' + (20240200 + i) : 'SO' + (20240300 + i);
    const date = isDup ? `2024.3.${i + 1}` : `2024.3.${i + 8}`;
    const region = i === 3 ? null : REGIONS[(i + 2) % 5];
    push('sales_2024_03.csv', 'sales_2024_03', i + 1, order, date, region, '¥' + money(r2(300 + rand() * 1800)), true, 'cn');
  }
  // 两条无法解析的日期，用于验证 rejected_rows
  rows[9].date = '2024-13-45';
  rows[31].date = '待补';
  return rows;
}

function parseDate(v){
  if (!v) return null;
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return valid(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
  if (m) return valid(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{4})年(\d{1,2})月(\d{1,2})日$/);
  if (m) return valid(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{4})\.(\d{1,2})\.(\d{1,2})$/);
  if (m) return valid(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
  if (m) return valid(+m[1], +m[2], +m[3]);
  return null;
  function valid(y, mo, d){
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    const dt = new Date(Date.UTC(y, mo - 1, d));
    if (dt.getUTCMonth() !== mo - 1) return null;
    return { iso: `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`, ts: dt.getTime(), month: `${y}-${String(mo).padStart(2, '0')}` };
  }
}

function parseAmount(v){
  if (v === null || v === undefined || v === '') return null;
  const s = String(v).replace(/[¥￥,\s]/g, '');
  const n = Number(s);
  return Number.isFinite(n) ? r2(n) : null;
}

/* ---------- state ---------- */
const S = {
  view: 'home',
  phase: 'empty',            // empty | parsed | planned | confirmed | running | verified
  rows: [],
  clean: [],
  rejected: [],
  groups: [],
  planVersion: 1,
  plan: [],
  confirmed: false,
  stepState: [],
  checks: [],
  running: false,
  page: 1,
  pageSize: 12,
  previewMode: 'raw',        // raw | clean
  dedupe: { key: '订单号', keep: 'latest' },
  nullStrategy: 'label',     // label | drop | empty
  dateFormat: 'YYYY-MM-DD',
  panelTab: 'ctx',
  prompt: '把这三份销售表合并，统一字段和日期格式，删除重复订单，按月份和地区统计销售额。',
  hiddenSheets: ['Sheet2'],
  logs: [],
  exported: false
};

function log(msg){
  const t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  S.logs.unshift({ t, msg });
  if (S.view === 'excel') renderPanel();
}
function toast(msg, kind = ''){
  const d = document.createElement('div');
  d.className = 'toast ' + kind;
  d.innerHTML = `<span class="dot"></span><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(d);
  setTimeout(() => { d.style.opacity = '0'; d.style.transition = 'opacity .25s'; setTimeout(() => d.remove(), 260); }, 2600);
}

/* ---------- quality ---------- */
function quality(){
  const rows = S.rows;
  const orderCount = {};
  rows.forEach(r => orderCount[r.order] = (orderCount[r.order] || 0) + 1);
  const dupOrders = Object.values(orderCount).filter(v => v > 1).length;
  return {
    rows: rows.length,
    files: 3,
    sheets: 4,
    badDate: rows.filter(r => !parseDate(r.date)).length,
    badAmount: rows.filter(r => parseAmount(r.amount) === null).length,
    nullRegion: rows.filter(r => r.region === '' || r.region === null).length,
    dupOrders,
    dupRows: rows.filter(r => orderCount[r.order] > 1).length,
    textAmount: rows.filter(r => r.amountIsText).length,
    hidden: S.hiddenSheets.length
  };
}

const STEP_NAMES = ['上传', '解析', '预览', '需求', '计划', '确认', '执行', '校验', '结果', '交付'];
function phaseStep(){
  switch (S.phase){
    case 'empty': return 0;
    case 'parsed': return 2;
    case 'planned': return 4;
    case 'confirmed': return 5;
    case 'running': return 6;
    case 'verified': return 9;
    default: return 0;
  }
}
function stepsBar(){
  const cur = phaseStep();
  return `<div class="steps">${STEP_NAMES.map((n, i) => {
    const cls = i < cur ? 'done' : (i === cur ? 'cur' : '');
    return `${i ? '<span class="st-sep"></span>' : ''}<div class="st ${cls}"><i>${i < cur ? '✓' : i + 1}</i>${n}</div>`;
  }).join('')}</div>`;
}

/* ---------- shared cards ---------- */
function cardFiles(){
  const q = quality();
  return `<div class="card fadein">
    <div class="card-h"><h2>源文件</h2><span class="tag">${S.rows.length} 行原始数据</span>
      <div class="right"><button class="btn sm ghost" data-act="reset">重新上传</button></div></div>
    <div class="card-b" style="padding:4px 14px 10px">
      <div class="files">
        <div class="file-row"><span class="ftag">XLSX</span>
          <div style="min-width:0;flex:1"><div class="li-t">sales_2024_01.xlsx</div><div class="li-s">Sheet1 · 22 行 · 4 列 · sha256 未变更</div></div>
          <span class="tag ok">已解析</span></div>
        <div class="file-row"><span class="ftag">XLSX</span>
          <div style="min-width:0;flex:1"><div class="li-t">sales_2024_02.xlsx</div><div class="li-s">销售明细 · 18 行 · 另含 1 个隐藏工作表 ${S.hiddenSheets[0]}</div></div>
          <span class="tag warn">隐藏表已跳过</span></div>
        <div class="file-row"><span class="ftag csv">CSV</span>
          <div style="min-width:0;flex:1"><div class="li-t">sales_2024_03.csv</div><div class="li-s">GBK 编码 · 16 行 · 表头为「订单编号 / 下单日期 / 区域 / 金额(元)」</div></div>
          <span class="tag warn">字段需映射</span></div>
      </div>
    </div>
  </div>`;
}

function cardQuality(){
  const q = quality();
  const cols = [
    { n: '订单号', t: 'string', nulls: 0, uniq: new Set(S.rows.map(r => r.order)).size, issue: `${q.dupOrders} 个订单号重复` },
    { n: '销售日期', t: '混合', nulls: 0, uniq: new Set(S.rows.map(r => r.date)).size, issue: `${q.badDate} 条无法解析` },
    { n: '地区', t: 'string', nulls: q.nullRegion, uniq: new Set(S.rows.map(r => r.region).filter(Boolean)).size, issue: `${q.nullRegion} 条为空` },
    { n: '销售额', t: '混合', nulls: 0, uniq: '-', issue: `${q.textAmount} 条为文本（含 ¥ 与千分位）` }
  ];
  return `<div class="card fadein" style="margin-top:14px">
    <div class="card-h"><h2>数据质量</h2><span class="tag warn">4 项待处理</span>
      <div class="right"><span class="muted" style="font-size:11px">按列统计 · 基于原始数据</span></div></div>
    <div class="card-b">
      <div class="qbar">
        <div class="qcell"><div class="n">${q.rows}</div><div class="l">总行数</div></div>
        <div class="qcell bad"><div class="n">${q.dupOrders}</div><div class="l">重复订单号</div></div>
        <div class="qcell warn"><div class="n">${q.badDate}</div><div class="l">日期不可解析</div></div>
        <div class="qcell warn"><div class="n">${q.nullRegion}</div><div class="l">地区为空</div></div>
      </div>
      <table class="colq">
        <thead><tr><th style="position:static;background:transparent;padding-left:0">字段</th><th style="background:transparent">推断类型</th><th style="background:transparent">空值率</th><th style="background:transparent">唯一值</th><th style="background:transparent">问题</th></tr></thead>
        <tbody>${cols.map(c => `<tr>
          <td style="padding-left:0;font-weight:550">${c.n}</td>
          <td><span class="tag">${c.t}</span></td>
          <td class="mono">${pct(c.nulls / q.rows)} <span class="meter" style="display:inline-block;width:40px;vertical-align:middle"><span class="${c.nulls ? '' : 'ok'}" style="width:${Math.min(100, c.nulls / q.rows * 600)}%"></span></span></td>
          <td class="mono">${c.uniq}</td>
          <td class="muted">${esc(c.issue)}</td></tr>`).join('')}</tbody>
      </table>
    </div>
  </div>`;
}

function cardData(){
  const isClean = S.previewMode === 'clean';
  const data = isClean ? S.clean : S.rows;
  const total = data.length;
  const pages = Math.max(1, Math.ceil(total / S.pageSize));
  if (S.page > pages) S.page = pages;
  const slice = data.slice((S.page - 1) * S.pageSize, S.page * S.pageSize);
  const head = isClean
    ? ['订单号', '销售日期', '地区', '销售额', '来源文件', '来源行']
    : ['订单号', '销售日期', '地区', '销售额', '来源文件', '来源行'];
  return `<div class="card fadein" style="margin-top:14px">
    <div class="card-h">
      <h2>${isClean ? '处理结果' : '数据预览'}</h2>
      <span class="tag">${total} 行</span>
      <div class="right">
        <div class="tabs">
          <button class="${!isClean ? 'on' : ''}" data-act="preview" data-mode="raw">原始</button>
          <button class="${isClean ? 'on' : ''}" data-act="preview" data-mode="clean" ${S.phase === 'verified' ? '' : 'disabled style="opacity:.4"'}>清洗后</button>
        </div>
        <button class="btn sm">筛选</button>
      </div>
    </div>
    <div class="tbl-wrap"><table><thead><tr>${head.map(h => `<th>${h}${h === '销售日期' ? '<span class="ty">string→date</span>' : h === '销售额' ? '<span class="ty">text→decimal</span>' : ''}</th>`).join('')}</tr></thead>
      <tbody>${slice.map(r => {
        if (isClean){
          return `<tr>
            <td class="mono">${esc(r.order)}</td>
            <td class="mono">${esc(r.iso)}</td>
            <td class="${!r.region && S.nullStrategy === 'empty' ? 'null' : ''}">${!r.region && S.nullStrategy === 'empty' ? '空值' : esc(r.region)}</td>
            <td class="mono">${money(r.amount)}</td>
            <td class="muted">${esc(r.file)}</td>
            <td class="muted mono">${r.line}</td>
          </tr>`;
        }
        const badDate = !parseDate(r.date);
        const badAmt = parseAmount(r.amount) === null;
        const nullRegion = r.region === '' || r.region === null;
        return `<tr>
          <td class="mono">${esc(r.order)}</td>
          <td class="mono ${badDate ? 'bad' : ''}">${esc(r.date)}</td>
          <td class="${nullRegion ? 'null' : ''}">${nullRegion ? '空值' : esc(r.region)}</td>
          <td class="mono ${badAmt ? 'bad' : (r.amountIsText ? 'dirty' : '')}">${esc(r.amount)}</td>
          <td class="muted">${esc(r.file)}</td>
          <td class="muted mono">${r.line}</td>
        </tr>`;
      }).join('')}</tbody></table></div>
    <div class="pager">
      <span>第 ${S.page} / ${pages} 页 · 每页 ${S.pageSize} 行</span>
      <span class="muted">${isClean ? '已去重、日期与金额已标准化' : `${quality().dupRows} 行属于重复订单`}</span>
      <div class="right">
        <button class="btn sm" data-act="page" data-p="-1" ${S.page === 1 ? 'disabled' : ''}>上一页</button>
        <button class="btn sm" data-act="page" data-p="1" ${S.page === pages ? 'disabled' : ''}>下一页</button>
      </div>
    </div>
  </div>`;
}

function cardTask(){
  return `<div class="card fadein" style="margin-top:14px">
    <div class="card-h"><h2>任务需求</h2><span class="tag acc">AI 理解</span></div>
    <div class="card-b">
      <div class="prompt">
        <textarea id="taskPrompt" rows="2" placeholder="用自然语言描述处理需求…">${esc(S.prompt)}</textarea>
        <div class="prompt-bar">
          <span class="muted" style="font-size:11px">附件：3 个文件 · 4 个工作表</span>
          <div style="margin-left:auto;display:flex;gap:6px">
            <button class="btn sm ghost" data-act="fillDemo">示例需求</button>
            <button class="btn sm primary" data-act="plan">生成执行计划</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderExcel(){
  const v = $('#view-excel');
  let body = '';
  if (S.phase === 'empty'){
    body = `<div class="card fadein">
      <div class="card-b">
        <div class="drop" data-act="upload">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 15v4a1 1 0 001 1h14a1 1 0 001-1v-4"/></svg>
          <div style="font-size:13px;font-weight:550">拖拽 Excel / CSV 到此处，或点击选择文件</div>
          <div class="li-s" style="margin-top:2px">支持 .xlsx / .xls / .csv，单文件 ≤ 50MB，原始文件只读</div>
        </div>
        <div class="callout acc" style="margin-top:12px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
          <div>原型使用 3 份内置样例文件（含重复订单、脏日期、GBK 编码 CSV、隐藏工作表），用于演示第 1–3 步。点击上传即完成解析。</div>
        </div>
      </div>
    </div>`;
  } else {
    body = cardFiles() + cardQuality() + cardData() + cardTask();
    if (S.plan.length) body += cardPlan();
    if (S.phase === 'verified') body += cardVerify() + cardDeliver();
  }
  v.innerHTML = stepsBar() + body;
  renderPanel();
}

/* ---------- plan ---------- */
function buildPlan(){
  const keepLabel = { latest: '保留最新记录', first: '保留第一条', max: '保留金额最大' }[S.dedupe.keep];
  S.plan = [
    { op: 'rename_columns', title: '统一字段名', params: { 订单编号: '订单号', 下单日期: '销售日期', 区域: '地区', '金额(元)': '销售额' } },
    { op: 'normalize_date', title: '日期标准化', params: { column: '销售日期', output: S.dateFormat, formats: ['YYYY-M-D', 'YYYY/M/D', 'YYYY年M月D日', 'YYYY.M.D', 'YYYYMMDD'] } },
    { op: 'cast', title: '金额转 Decimal', params: { column: '销售额', type: 'decimal', scale: 2, strip: ['¥', ','] } },
    { op: 'fillna', title: '空值处理（地区）', params: { column: '地区', strategy: S.nullStrategy } },
    { op: 'merge_files', title: '纵向合并 3 个文件', params: { files: 3, on: '字段映射' } },
    { op: 'dedupe', title: '删除重复订单', params: { keys: [S.dedupe.key], keep: keepLabel }, confirm: true },
    { op: 'groupby', title: '按月份 × 地区汇总销售额', params: { by: ['月份', '地区'], agg: '销售额: sum' } },
    { op: 'export', title: '导出合并结果与汇总', params: { format: 'xlsx', sheets: ['明细', '汇总', '质量报告'] } }
  ];
  S.stepState = S.plan.map(() => 'idle');
  S.confirmed = false;
}

function cardPlan(){
  const waiting = S.phase === 'planned' || S.phase === 'confirmed';
  return `<div class="card fadein" style="margin-top:14px">
    <div class="card-h"><h2>执行计划</h2>
      <span class="tag acc">计划 v${S.planVersion}</span>
      ${S.confirmed ? '<span class="tag ok"><span class="dot"></span>参数已确认</span>' : '<span class="tag warn">需确认 1 项</span>'}
      <div class="right"><span class="muted" style="font-size:11px">${S.plan.length} 个步骤 · 全部为确定性操作</span></div>
    </div>
    <div class="card-b">
      ${waiting ? `<div class="panel-sec" style="margin-bottom:12px">
        <h3 style="font-size:11px;letter-spacing:.06em;color:var(--text-3);margin:0 0 6px;font-weight:650">确认处理规则</h3>
        <div class="field"><label>去重键</label>
          <select data-confirm="key"><option ${S.dedupe.key === '订单号' ? 'selected' : ''}>订单号</option><option ${S.dedupe.key === '订单号+销售日期' ? 'selected' : ''}>订单号+销售日期</option></select>
          <span class="hint">缺失时禁止去重</span></div>
        <div class="field"><label>保留策略</label>
          <select data-confirm="keep">
            <option value="latest" ${S.dedupe.keep === 'latest' ? 'selected' : ''}>保留最新记录</option>
            <option value="first" ${S.dedupe.keep === 'first' ? 'selected' : ''}>保留第一条</option>
            <option value="max" ${S.dedupe.keep === 'max' ? 'selected' : ''}>保留金额最大</option>
          </select>
          <span class="hint">影响 ${quality().dupOrders} 个重复订单</span></div>
        <div class="field"><label>空值策略</label>
          <select data-confirm="null">
            <option value="label" ${S.nullStrategy === 'label' ? 'selected' : ''}>填充为「未填写」</option>
            <option value="drop" ${S.nullStrategy === 'drop' ? 'selected' : ''}>删除该行（记入拒绝数据）</option>
            <option value="empty" ${S.nullStrategy === 'empty' ? 'selected' : ''}>保留为空</option>
          </select>
          <span class="hint">${quality().nullRegion} 行地区为空</span></div>
        <div class="field"><label>日期格式</label>
          <select data-confirm="date"><option>YYYY-MM-DD</option><option>YYYY/MM/DD</option><option>YYYYMMDD</option></select>
          <span class="hint">${quality().badDate} 行无法解析将进入拒绝数据</span></div>
      </div>` : ''}
      <div class="plan">${S.plan.map((p, i) => {
        const st = S.stepState[i] || 'idle';
        return `<div class="pstep ${p.confirm ? 'confirm' : ''}">
          <div class="idx">${st === 'done' ? '✓' : i + 1}</div>
          <div style="min-width:0">
            <div class="op">${esc(p.title)} ${p.confirm ? '<span class="tag warn" style="margin-left:4px">需确认</span>' : ''}</div>
            <div class="pp">${esc(JSON.stringify(p.params))}</div>
          </div>
          <div class="r">${st === 'done' ? '<span class="res">完成</span>' : st === 'run' ? '<span class="res run"><span class="spinner"></span> 执行中</span>' : '<span class="muted" style="font-size:11px">待执行</span>'}</div>
        </div>`;
      }).join('')}</div>
      <div class="row" style="margin-top:12px;align-items:center">
        ${S.phase === 'verified'
          ? '<span class="tag ok"><span class="dot"></span>执行完成 · 校验通过</span>'
          : `<button class="btn primary" data-act="run" ${S.phase === 'running' ? 'disabled' : ''}>${S.phase === 'running' ? '<span class="spinner" style="border-color:#fff5;border-top-color:#fff"></span> 执行中' : S.confirmed ? '执行任务' : '确认并执行'}</button>
             <button class="btn ghost" data-act="replan">重新生成计划</button>`}
        <span class="muted" style="margin-left:auto;font-size:11px">原始文件不会被覆盖 · 每步写入操作记录</span>
      </div>
    </div>
  </div>`;
}

/* ---------- execute ---------- */
function execute(){
  const parsed = [], rejected = [];
  S.rows.forEach(r => {
    const d = parseDate(r.date);
    const amt = parseAmount(r.amount);
    if (!d) return rejected.push({ ...r, reason: `销售日期无法解析：「${r.date}」` });
    if (amt === null) return rejected.push({ ...r, reason: `销售额不是有效数字：「${r.amount}」` });
    let region = r.region;
    if (region === '' || region === null){
      if (S.nullStrategy === 'drop') return rejected.push({ ...r, reason: '地区为空，按策略删除' });
      region = S.nullStrategy === 'label' ? '未填写' : '';
    }
    parsed.push({ ...r, iso: d.iso, ts: d.ts, month: d.month, amount: amt, region });
  });

  const map = new Map();
  parsed.forEach(r => {
    const k = r.order;
    const cur = map.get(k);
    if (!cur) return map.set(k, r);
    if (S.dedupe.keep === 'first') return;
    if (S.dedupe.keep === 'max') { if (r.amount > cur.amount) map.set(k, r); return; }
    if (r.ts >= cur.ts) map.set(k, r);
  });
  const clean = Array.from(map.values()).sort((a, b) => a.order.localeCompare(b.order));

  const g = {};
  clean.forEach(r => {
    const k = r.month + '|' + r.region;
    g[k] = g[k] || { month: r.month, region: r.region, amount: 0, count: 0 };
    g[k].amount = r2(g[k].amount + r.amount);
    g[k].count++;
  });
  S.clean = clean;
  S.rejected = rejected;
  S.groups = Object.values(g).sort((a, b) => a.month.localeCompare(b.month) || b.amount - a.amount);

  const detailSum = r2(sum(clean.map(r => r.amount)));
  const groupSum = r2(sum(S.groups.map(r => r.amount)));
  S.checks = [
    { name: '行数守恒', detail: `${parsed.length} 解析 − ${parsed.length - clean.length} 重复 = ${clean.length}`, pass: parsed.length - (parsed.length - clean.length) === clean.length },
    { name: '明细合计 = 汇总合计', detail: `¥${money(detailSum)} vs ¥${money(groupSum)}`, pass: Math.abs(detailSum - groupSum) < 0.005 },
    { name: '日期格式合规', detail: `${clean.length} 行全部为 ${S.dateFormat}`, pass: clean.every(r => /^\d{4}-\d{2}-\d{2}$/.test(r.iso)) },
    { name: '空值已处理', detail: `地区空值 ${clean.filter(r => !r.region).length} 行`, pass: clean.filter(r => !r.region).length === 0 || S.nullStrategy === 'empty' },
    { name: '金额精度', detail: '全部保留两位小数', pass: clean.every(r => Math.abs(r.amount * 100 - Math.round(r.amount * 100)) < 1e-6) },
    { name: '拒绝数据可追溯', detail: `${rejected.length} 行含来源文件与行号`, pass: rejected.every(r => r.file && r.line && r.reason) },
    { name: '原始文件未变更', detail: 'sha256 上传前后一致', pass: true }
  ];
}

function runTask(){
  if (S.phase === 'running') return;
  if (!S.confirmed){ S.confirmed = true; S.planVersion = Math.max(1, S.planVersion); toast('已按当前参数确认计划 v' + S.planVersion); }
  S.phase = 'running';
  S.running = true;
  S.stepState = S.plan.map(() => 'idle');
  renderExcel();
  log('任务开始：' + S.plan.length + ' 个步骤');
  let i = 0;
  const tick = () => {
    if (i > 0) S.stepState[i - 1] = 'done';
    if (i < S.plan.length){
      S.stepState[i] = 'run';
      log(`步骤 ${i + 1}/${S.plan.length} ${S.plan[i].title}`);
      renderExcel();
      i++;
      setTimeout(tick, 420);
    } else {
      execute();
      S.running = false;
      S.phase = 'verified';
      S.previewMode = 'clean';
      log(`完成：${S.clean.length} 行，拒绝 ${S.rejected.length} 行，校验 ${S.checks.every(c => c.pass) ? '通过' : '未通过'}`);
      renderExcel();
      toast('任务完成，校验通过');
    }
  };
  setTimeout(tick, 200);
}

function csvOf(rows, header, mapper){
  const lines = [header.join(',')].concat(rows.map(r => mapper(r).map(v => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')));
  return '\uFEFF' + lines.join('\r\n');
}
function download(name, text, type = 'text/csv;charset=utf-8'){
  const blob = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

        <div class="kv"><span class="k">原始文件 sha256</span><span class="v">未变更</span></div>
      </div>
      <div class="panel-sec"><h3>数据质量</h3>
        <div class="kv"><span class="k">重复订单号</span><span class="v" style="color:var(--err)">${q.dupOrders}</span></div>
        <div class="kv"><span class="k">日期不可解析</span><span class="v" style="color:var(--warn)">${q.badDate}</span></div>
        <div class="kv"><span class="k">地区为空</span><span class="v" style="color:var(--warn)">${q.nullRegion}</span></div>
        <div class="kv"><span class="k">金额为文本</span><span class="v" style="color:var(--warn)">${q.textAmount}</span></div>
      </div>
      ${S.phase === 'verified' ? `<div class="panel-sec"><h3>处理结果</h3>
        <div class="kv"><span class="k">清洗后行数</span><span class="v">${S.clean.length}</span></div>
        <div class="kv"><span class="k">拒绝行</span><span class="v">${S.rejected.length}</span></div>
        <div class="kv"><span class="k">销售额合计</span><span class="v">¥${money(total)}</span></div>
        <div class="kv"><span class="k">版本链</span><span class="v">原始 → v2 → v3</span></div>
      </div>` : ''}
      <div class="panel-sec"><h3>任务</h3>
        <div class="kv"><span class="k">状态</span><span class="v">${{ empty: '未开始', parsed: '已解析', planned: '待确认', confirmed: '已确认', running: '执行中', verified: '已完成' }[S.phase]}</span></div>
        <div class="kv"><span class="k">计划版本</span><span class="v">v${S.planVersion}</span></div>
      </div>`;
  };
  const plan = () => S.plan.length ? `<div class="panel-sec"><h3>执行计划 · v${S.planVersion}</h3>
      ${S.plan.map((p, i) => `<div class="pstep" style="padding:6px 0">
        <div class="idx">${S.stepState[i] === 'done' ? '✓' : i + 1}</div>
        <div style="min-width:0"><div class="op" style="font-size:12px">${esc(p.title)}</div></div>
        <div class="r">${S.stepState[i] === 'run' ? '<span class="spinner"></span>' : S.stepState[i] === 'done' ? '<span class="res">✓</span>' : ''}</div>
      </div>`).join('')}
    </div>` : `<div class="empty">生成计划后在此查看步骤</div>`;
  const logs = () => S.logs.length ? `<div class="panel-sec"><h3>执行日志</h3>${S.logs.slice(0, 30).map(l => `<div class="kv" style="display:block"><span class="k mono">${l.t}</span><div style="font-size:11.5px;margin-top:-1px">${esc(l.msg)}</div></div>`).join('')}</div>` : `<div class="empty">暂无日志</div>`;
  $('#panelBody').innerHTML = S.panelTab === 'ctx' ? ctx() : S.panelTab === 'plan' ? plan() : logs();
}

/* ---------- actions ---------- */
function parseFiles(){
  S.rows = buildRows();
  S.phase = 'parsed';
  S.page = 1;
  S.plan = [];
  S.clean = [];
  S.rejected = [];
  S.checks = [];
  S.previewMode = 'raw';
  S.confirmed = false;
  S.planVersion = 1;
  S.logs = [];
  log('解析 3 个文件：4 个工作表（1 隐藏已跳过）');
  log(`识别 ${S.rows.length} 行，发现 ${quality().dupOrders} 个重复订单号`);
  renderExcel();
  toast('解析完成，发现 4 类数据问题');
}

function makePlan(){
  const ta = $('#taskPrompt');
  if (ta) S.prompt = ta.value.trim() || S.prompt;
  buildPlan();
  S.phase = 'planned';
  S.planVersion = 1;
  log('生成计划 v1：8 个确定性步骤，1 项需确认');
  renderExcel();
  toast('已生成执行计划 v1');
  const card = $$('#view-excel .card').find(c => c.textContent.includes('执行计划'));
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function setConfirm(type, value){
  if (type === 'key') S.dedupe.key = value;
  if (type === 'keep') S.dedupe.keep = value;
  if (type === 'null') S.nullStrategy = value;
  if (type === 'date') S.dateFormat = value;
  S.planVersion++;
  S.confirmed = false;
  buildPlan();
  S.phase = 'planned';
  log(`参数已修改，计划升级为 v${S.planVersion}，旧确认失效`);
  renderExcel();
  toast(`参数变更 → 计划 v${S.planVersion}`);
}

function switchView(key){
  S.view = key;
  $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === key));
  ['home', 'excel', 'ai', 'generic'].forEach(k => $('#view-' + k).hidden = true);
  const crumb = { home: 'Home', ai: 'AI Assistant', excel: 'Excel Workspace · 三份销售表合并', analytics: 'Data Analytics', report: 'Report Studio', projects: 'Projects', files: 'Files', tasks: 'Tasks', settings: 'Settings' }[key] || key;
  $('#crumb').innerHTML = key === 'home' ? '<b>Home</b>' : `<span>Workspace</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 6l6 6-6 6"/></svg><b>${crumb}</b>`;
  if (key === 'home'){ $('#view-home').hidden = false; renderHome(); }
  else if (key === 'excel'){ $('#view-excel').hidden = false; renderExcel(); }
  else if (key === 'ai'){ $('#view-ai').hidden = false; renderAI(); }
  else { $('#view-generic').hidden = false; renderGeneric(key); }
  $('#scroll').scrollTop = 0;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const nav = e.target.closest('.nav-item');
  if (nav){ switchView(nav.dataset.view); return; }

  const goto = e.target.closest('[data-view]');
  if (goto && !goto.classList.contains('nav-item')){ switchView(goto.dataset.view); return; }

  const chip = e.target.closest('[data-chip]');
  if (chip){
    const map = {
      清洗: '清洗这份表格：去除多余空格，统一日期格式和金额格式，并生成数据质量报告。',
      合并: '把这三份销售表纵向合并，统一字段名称，并标注每条数据的来源文件。',
      对比: '对比两个月的销售数据，找出新增、缺失和金额异常的订单。',
      统计: '按月份和地区统计销售额与订单数，输出汇总表。',
      报告: '基于合并后的数据生成销售分析摘要，包含趋势和地区排名。'
    };
    S.prompt = map[chip.dataset.chip] || S.prompt;
    if (S.phase === 'empty'){ switchView('excel'); parseFiles(); }
    else switchView('excel');
    toast('已填入示例需求');
    return;
  }

  const tab = e.target.closest('#panelTabs button');
  if (tab){
    $$('#panelTabs button').forEach(b => b.classList.toggle('on', b === tab));
    S.panelTab = tab.dataset.ptab;
    renderPanel();
    return;
  }

  if (e.target.closest('#panelBtn')){
    $('#app').classList.toggle('panel-collapsed');
    return;
  }

  const act = e.target.closest('[data-act]');
  if (!act) return;
  const a = act.dataset.act;

  if (a === 'upload'){ parseFiles(); }
  else if (a === 'reset'){
    Object.assign(S, { phase: 'empty', rows: [], clean: [], rejected: [], groups: [], plan: [], checks: [], logs: [], confirmed: false, planVersion: 1, page: 1, previewMode: 'raw', exported: false, dedupe: { key: '订单号', keep: 'latest' }, nullStrategy: 'label', dateFormat: 'YYYY-MM-DD' });
    renderExcel(); renderHome(); toast('已重置');
  }
  else if (a === 'page'){
    S.page = Math.max(1, S.page + Number(act.dataset.p));
    renderExcel();
  }
  else if (a === 'preview'){
    if (S.phase !== 'verified' && act.dataset.mode === 'clean') return;
    S.previewMode = act.dataset.mode;
    S.page = 1;
    renderExcel();
  }
  else if (a === 'fillDemo'){
    S.prompt = '把这三份销售表合并，统一字段和日期格式，删除重复订单，按月份和地区统计销售额。';
    renderExcel();
  }
  else if (a === 'plan' || a === 'replan'){ makePlan(); }
  else if (a === 'run'){ runTask(); }
  else if (a === 'start'){
    const ta = $('#homePrompt');
    if (ta && ta.value.trim()) S.prompt = ta.value.trim();
    switchView('excel');
    if (S.phase === 'empty') parseFiles();
    else toast('已回到当前任务');
  }
  else if (a === 'goto-excel'){
    switchView('excel');
    if (S.phase === 'empty') parseFiles();
  }
  else if (a === 'attach'){ toast('原型模式：文件已内置为 3 个样例'); }
  else if (a === 'send'){
    const input = $('#chatInput');
    const text = input.value.trim();
    if (!text) return;
    CHAT.push({ who: 'me', html: esc(text) });
    CHAT.push({ who: 'ai', html: '已记录。原型阶段对话不调用真实模型；执行计划固定在 Excel 工作台中确认与演示。<div style="margin-top:8px"><button class="btn sm primary" data-act="goto-excel">打开 Excel 工作台</button></div>' });
    renderAI();
    const msgs = $('#msgs');
    if (msgs) msgs.scrollTop = msgs.scrollHeight;
  }
  else if (a === 'export-xlsx'){
    if (S.phase !== 'verified') return toast('校验未通过，禁止导出', 'warn');
    download('merged_sales_result.csv', csvOf(S.clean,
      ['订单号', '销售日期', '地区', '销售额', '来源文件', '来源行'],
      r => [r.order, r.iso, r.region, r.amount.toFixed(2), r.file, r.line]));
    log('导出 merged_sales_result.csv');
    toast('已下载合并结果（含 BOM，Excel 可直接打开）');
  }
  else if (a === 'export-verify'){
    const report = {
      task_id: 't_m0_demo', plan_version: S.planVersion,
      status: S.checks.every(c => c.pass) ? 'pass' : 'fail',
      rows_before: S.rows.length, rows_after: S.clean.length,
      rejected_rows: S.rejected.length,
      checks: S.checks.map(c => ({ name: c.name, detail: c.detail, pass: c.pass }))
    };
    download('verification_report.json', JSON.stringify(report, null, 2), 'application/json');
    toast('已下载校验报告');
  }
  else if (a === 'export-reject'){
    download('rejected_rows.csv', csvOf(S.rejected,
      ['来源文件', '来源行号', '订单号', '销售日期', '地区', '销售额', '拒绝原因'],
      r => [r.file, r.line, r.order, r.date, r.region ?? '', r.amount, r.reason]));
    toast(`已下载 ${S.rejected.length} 行拒绝数据`);
  }
});

document.addEventListener('change', e => {
  const sel = e.target.closest('[data-confirm]');
  if (!sel) return;
  if (S.phase === 'verified' || S.phase === 'running') return;
  setConfirm(sel.dataset.confirm, sel.value);
});

document.addEventListener('input', e => {
  if (e.target.id === 'taskPrompt' || e.target.id === 'homePrompt') S.prompt = e.target.value;
});

document.addEventListener('keydown', e => {
  if (!(e.key === 'Enter' && (e.metaKey || e.ctrlKey))) return;
  if (e.target.id === 'homePrompt'){ const b = $('[data-act="start"]'); if (b) b.click(); }
  if (e.target.id === 'taskPrompt') makePlan();
  if (e.target.id === 'chatInput'){ const b = $('[data-act="send"]'); if (b) b.click(); }
});

/* ---------- init ---------- */
renderHome();
switchView('home');
renderPanel();
</script>
</body>
</html>
