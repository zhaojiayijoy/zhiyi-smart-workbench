<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学生答疑 · 致壹 智能教育工作台</title>
<link rel="stylesheet" href="assets/css/site.css?v=1795700080">
</head>
<body data-page="tutor">
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div><h1>学生答疑</h1><p class="sub" data-page-sub>先给提示，再指出卡点，最后才给完整解析</p></div>
        <div class="right"><a class="btn primary" href="#newAsk">＋ 新建答疑</a></div>
      </div>

      <div class="ctx">
        <div><span class="k">当前课程</span><b data-fill="course.name">—</b></div>
        <div><span class="k">授课对象</span><b data-fill="course.classWithSize">—</b></div>
        <div><span class="k">进度</span><b data-fill="course.progress">—</b></div>
      </div>

      <div class="grid g4" style="margin-bottom:14px">
        <div class="kpi"><div class="label">答疑记录</div><div class="value">—</div><div class="foot">近 30 天</div></div>
        <div class="kpi ok"><div class="label">已解决</div><div class="value">—</div><div class="foot">解决率 —</div></div>
        <div class="kpi warn"><div class="label">需要关注</div><div class="value">—</div><div class="foot">连续两次未解决</div></div>
        <div class="kpi"><div class="label">高频知识点</div><div class="value" style="font-size:14px">—</div><div class="foot">出现 — 次</div></div>
      </div>

      <div class="tutor-layout">
        <div class="card tutor-list">
          <div class="card-h"><h2>答疑列表</h2><div class="right"><span class="mini" id="tutorCount">—</span></div></div>
          <div class="card-b" style="padding-top:8px"><div class="mini" style="padding:10px 0">暂无数据</div></div>
        </div>

        <div class="card">
          <div class="card-h"><h2 id="tutorDetailTitle">暂无提问</h2><div class="right"><span class="tag acc" id="tutorDetailStatus">—</span></div></div>
          <div class="card-b">
            <div class="msg me" style="margin-bottom:12px">
              <div class="who">—</div>
              <div class="bubble" id="tutorBubble">暂无数据</div>
            </div>
            <div class="tabs">
              <button class="on" data-tab="hint">提示</button>
              <button data-tab="stuck">卡点</button>
              <button data-tab="full">完整解析</button>
            </div>
            <div class="tabpane on" data-pane="hint">
              <div class="rule">暂无数据</div>
            </div>
            <div class="tabpane" data-pane="stuck">
              <div class="rule">暂无数据</div>
            </div>
            <div class="tabpane" data-pane="full">
              <div class="rule">暂无数据</div>
              <div class="form-actions" style="margin-top:12px">
                <button class="btn" type="button" data-demo="已标记为已解决">标记已解决</button>
                <button class="btn ghost" type="button" data-demo="已转教师接管">转教师接管</button>
              </div>
            </div>
          </div>
        </div>

        <div class="card" id="newAsk">
          <div class="card-h"><h2>新建答疑</h2></div>
          <div class="card-b">
            <form data-sim="#askOut" data-msg="答疑已创建">
              <div class="field"><label>学生问题 *</label><textarea required style="min-height:96px" placeholder="粘贴学生原问题，保留原始表述"></textarea></div>
              <div class="field"><label>关联知识点</label><select><option>参照群体</option><option>锚定效应</option><option>消费者态度</option><option>损失厌恶</option><option>其他</option></select></div>
              <div class="form-actions"><button class="btn" type="submit">创建答疑</button><button class="btn" type="reset">清空</button></div>
            </form>
            <div class="rule" id="askOut" hidden style="margin-top:12px">暂无数据</div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<div class="toast"></div>
<script src="assets/js/data.js?v=1795420906"></script>
<script src="assets/js/site.js?v=1795700060"></script>
<script src="assets/js/api.js?v=1795700003"></script>
<script src="assets/js/live.js?v=1795700005"></script>
</body>
</html>
