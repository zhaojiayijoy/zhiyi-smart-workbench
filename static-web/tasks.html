<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>任务中心 · 致壹 智能教育工作台</title>
<link rel="stylesheet" href="assets/css/site.css?v=1795620000">
</head>
<body data-page="tasks">
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div><h1>任务中心</h1><p class="sub">备课、实训、评审与答疑的执行记录</p></div>
        <div class="right"><button class="btn primary" type="button" data-go="index.html">＋ 新建教学任务</button></div>
      </div>

      <div class="grid g4" style="margin-bottom:14px">
        <div class="kpi"><div class="label">进行中</div><div class="value">—</div><div class="foot">—</div></div>
        <div class="kpi warn"><div class="label">待处理</div><div class="value">—</div><div class="foot">—</div></div>
        <div class="kpi ok"><div class="label">已完成</div><div class="value">—</div><div class="foot">近 30 天</div></div>
        <div class="kpi"><div class="label">累计参与学生</div><div class="value">—</div><div class="foot">—</div></div>
      </div>

      <div class="card" style="margin-bottom:14px">
        <div class="card-h">
          <h2>全部任务</h2>

        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>任务</th><th>类型</th><th>课程</th><th>状态</th><th>进度</th><th>更新时间</th><th></th></tr></thead>
            <tbody>
              <tr><td colspan="7" class="mini">暂无数据</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="split">
        <div class="card">
          <div class="card-h"><h2>最近活动</h2></div>
          <div class="card-b tight">
            <div class="list-item"><div class="mini" style="padding:10px 0">暂无数据</div></div>
          </div>
        </div>

        <div class="card">
          <div class="card-h"><h2>本周待办</h2><div class="right"><span class="tag warn">—</span></div></div>
          <div class="card-b">
            <div class="stack" style="gap:8px">
              <div class="rule">暂无数据</div>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<div class="toast"></div>

<script src="assets/js/data.js?v=1795420906"></script>
<script src="assets/js/site.js?v=1795600000"></script>
<script src="assets/js/api.js?v=1795700003"></script>
<script src="assets/js/live.js?v=1795700002"></script>
</body>
</html>
