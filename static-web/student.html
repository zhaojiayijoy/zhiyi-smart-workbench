<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学生空间 · 致壹 智能教育工作台</title>
<link rel="stylesheet" href="assets/css/site.css?v=1795700100">
</head>
<body data-page="student" data-mode="student">
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar"></header>
    <main class="content">

      <section class="hero" id="studentHero">
        <h1>你好，同学</h1>
        <p><span data-fill="course.classWithSize">—</span> · <b data-fill="course.name">—</b>。暂无待办与反馈数据。</p>
        <div class="row">
          <a class="btn primary" href="#tasks">查看我的任务</a>
          <a class="btn" href="#qa">我要提问</a>
        </div>
      </section>

      <div class="compact-bar" id="subBar" hidden>
        <div>
          <h2 id="subBarTitle">我的任务</h2>
          <p class="sub" id="subBarSub">—</p>
          <div class="sub-stats" id="subStats">
            <span class="pill"><b id="statTasks">0</b> 个待完成</span>
            <span class="pill"><b id="statFb">0</b> 条未读反馈</span>
          </div>
        </div>
        <a class="btn" href="#home">返回首页</a>
      </div>

      <div class="grid g4" id="studentKpis" style="margin-bottom:14px">
        <div class="kpi warn"><div class="label">待完成任务</div><div class="value">—</div><div class="foot">—</div></div>
        <div class="kpi"><div class="label">待阅读反馈</div><div class="value">—</div><div class="foot">—</div></div>
        <div class="kpi ok"><div class="label">作业平均分</div><div class="value">—</div><div class="foot">—</div></div>
        <div class="kpi"><div class="label">错题回顾</div><div class="value">—</div><div class="foot">—</div></div>
      </div>

      <div class="card">
        <div class="card-b" style="padding-bottom:6px">
          <div class="tabs" data-hash>
            <button class="on" data-tab="home">学生首页</button>
            <button data-tab="tasks">我的任务</button>
            <button data-tab="qa">我的答疑</button>
            <button data-tab="feedback">教师反馈</button>
            <button data-tab="review">错题回顾</button>
          </div>

          <div class="tabpane on" data-pane="home">
            <div class="split">
              <div>
                <h3>今日安排</h3>
                <div class="stack" style="gap:8px">
                  <div class="mini" style="padding:10px 0">暂无数据</div>
                </div>
              </div>
              <div>
                <h3>学习进度</h3>
                <div class="bars">
                  <div class="mini" style="padding:10px 0">暂无数据</div>
                </div>
              </div>
            </div>
          </div>

          <div class="tabpane" data-pane="tasks">
            <div class="table-wrap">
              <table>
                <thead><tr><th>任务</th><th>类型</th><th>截止时间</th><th>状态</th><th>操作</th></tr></thead>
                <tbody>
                  <tr><td colspan="5" class="mini">暂无数据</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="tabpane" data-pane="qa">
            <div class="split">
              <div>
                <h3>我的提问</h3>
                <div class="stack" style="gap:8px">
                  <div class="mini" style="padding:10px 0">暂无数据</div>
                </div>
              </div>
              <div>
                <h3>我要提问</h3>
                <form data-sim="#stuAskOut" data-msg="问题已提交">
                  <div class="field"><label>你的问题</label><textarea required style="min-height:96px" placeholder="先写下你已经想到的思路"></textarea></div>
                  <div class="field"><label>关联知识点</label><select><option>参照群体</option><option>锚定效应</option><option>消费者态度</option><option>损失厌恶</option></select></div>
                  <div class="form-actions"><button class="btn primary" type="submit">提交问题</button></div>
                </form>
                <div class="rule" id="stuAskOut" hidden style="margin-top:12px">提交后将在此显示教师或 AI 的反馈。</div>
              </div>
            </div>
          </div>

          <div class="tabpane" data-pane="feedback">
            <div class="filter-row">
              <select id="fbFilter" aria-label="筛选反馈">
                <option value="">全部反馈</option>
                <option value="unread">未读</option>
                <option value="read">已读</option>
              </select>
              <span class="mini" id="fbCount">共 0 条</span>
              <span style="flex:1"></span>
              <button class="btn sm" type="button" id="fbPrev">上一页</button>
              <span class="mini" id="fbPage">0 / 1</span>
              <button class="btn sm" type="button" id="fbNext">下一页</button>
            </div>
            <div class="stack" id="fbList" style="gap:10px">
              <div class="mini" style="padding:10px 0">暂无数据</div>
            </div>
          </div>

          <div class="tabpane" data-pane="review">
            <div class="rule" style="margin-bottom:12px">
              <div class="bar-row">
                <div class="t"><b>掌握进度</b><span id="rvProgText">暂无数据</span></div>
                <div class="bar"><i id="rvProgBar" data-w="0" style="width:0"></i></div>
              </div>
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>题目</th><th>知识点</th><th>掌握度</th><th>最近错误</th><th>状态</th><th>操作</th></tr></thead>
                <tbody id="rvTbody">
                  <tr><td colspan="6" class="mini">暂无数据</td></tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </div>

    </main>
  </div>
</div>

<div class="toast"></div>
<script>
(function(){
  function toast(msg){
    if (window.Edu && Edu.toast) Edu.toast(msg);
    else window.alert(msg);
  }

  /* 1. 子页紧凑标题栏：只在首页保留欢迎区与四张统计卡 */
  var hero = document.getElementById("studentHero");
  var kpis = document.getElementById("studentKpis");
  var subBar = document.getElementById("subBar");
  var tabBox = document.querySelector(".tabs[data-hash]");
  var titles = {
    tasks: ["我的任务", "查看待完成与已提交的作业、实训与练习"],
    qa: ["我的答疑", "查看提问记录与老师提示"],
    feedback: ["教师反馈", "整卡点击查看详情，支持未读筛选与翻页"],
    review: ["错题回顾", "查看错题记录与订正进度"]
  };
  function updateStats(){
    var todo = 0;
    Array.prototype.forEach.call(document.querySelectorAll('[data-pane="tasks"] tbody tr'), function(tr){
      var tag = tr.querySelector(".tag");
      if (tag && /warn/.test(tag.className)) todo++;
    });
    var unread = document.querySelectorAll('#fbList .fb[data-read="0"]').length;
    if (document.getElementById("statTasks")) document.getElementById("statTasks").textContent = todo;
    if (document.getElementById("statFb")) document.getElementById("statFb").textContent = unread;
  }

  function chrome(){
    var on = tabBox ? tabBox.querySelector("button.on") : null;
    var key = on ? on.getAttribute("data-tab") : "home";
    var isHome = key === "home";
    if (hero) hero.style.display = isHome ? "" : "none";
    if (kpis) kpis.style.display = isHome ? "" : "none";
    if (subBar){
      subBar.hidden = isHome;
      if (!isHome){
        var t = titles[key] || ["", ""];
        document.getElementById("subBarTitle").textContent = t[0];
        document.getElementById("subBarSub").textContent = t[1];
      }
    }
    updateStats();
  }
  if (tabBox) tabBox.addEventListener("click", function(){ setTimeout(chrome, 0); });
  window.addEventListener("hashchange", function(){ setTimeout(chrome, 0); });
  chrome();

  /* 2. 教师反馈：整卡可点击 + 未读标记 + 筛选 + 分页 */
  var fbList = document.getElementById("fbList");
  if (fbList){
    function allFb(){ return Array.prototype.slice.call(fbList.querySelectorAll(".fb")); }
    var fbFilter = document.getElementById("fbFilter");
    var fbCount = document.getElementById("fbCount");
    var fbPageEl = document.getElementById("fbPage");
    var fbPrev = document.getElementById("fbPrev");
    var fbNext = document.getElementById("fbNext");
    var fbPage = 1, PER = 2;

    function renderFb(){
      var f = fbFilter ? fbFilter.value : "";
      var pool = allFb().filter(function(c){
        var read = c.getAttribute("data-read") === "1";
        return !f || (f === "read" && read) || (f === "unread" && !read);
      });
      var pages = Math.max(1, Math.ceil(pool.length / PER));
      if (fbPage > pages) fbPage = pages;
      allFb().forEach(function(c){ c.style.display = "none"; });
      pool.slice((fbPage - 1) * PER, fbPage * PER).forEach(function(c){ c.style.display = ""; });
      if (fbCount) fbCount.textContent = "共 " + pool.length + " 条";
      if (fbPageEl) fbPageEl.textContent = (pool.length ? fbPage : 0) + " / " + pages;
      if (fbPrev) fbPrev.disabled = fbPage <= 1;
      if (fbNext) fbNext.disabled = fbPage >= pages;
    }
    if (fbFilter) fbFilter.addEventListener("change", function(){ fbPage = 1; renderFb(); });
    if (fbPrev) fbPrev.addEventListener("click", function(){ fbPage = Math.max(1, fbPage - 1); renderFb(); });
    if (fbNext) fbNext.addEventListener("click", function(){ fbPage++; renderFb(); });

    fbList.addEventListener("click", function(e){
      var card = e.target.closest(".fb");
      if (!card) return;
      card.setAttribute("data-read", "1");
      var tag = card.querySelector(".fb-unread");
      if (tag) tag.hidden = true;
      renderFb();
      updateStats();
    });
    fbList.addEventListener("keydown", function(e){
      if (e.key === "Enter" || e.key === " "){
        var c = e.target.closest(".fb");
        if (c){ e.preventDefault(); c.click(); }
      }
    });
    renderFb();
  }

  /* 3. 错题回顾：接口暂未接入错题数据，仅保留进度占位 */
  var rvTbody = document.getElementById("rvTbody");
  if (rvTbody){
    var rvProgText = document.getElementById("rvProgText");
    var rvProgBar = document.getElementById("rvProgBar");
    if (rvProgText) rvProgText.textContent = "暂无数据";
    if (rvProgBar) rvProgBar.style.width = "0%";
  }
})();
</script>
<script src="assets/js/data.js?v=1795420906"></script>
<script src="assets/js/site.js?v=1795700070"></script>
<script src="assets/js/api.js?v=1795700003"></script>
<script src="assets/js/live.js?v=1795700004"></script>
</body>
</html>
