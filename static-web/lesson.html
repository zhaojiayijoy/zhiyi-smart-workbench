<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一键备课 · 致壹 智能教育工作台</title>
<link rel="stylesheet" href="assets/css/site.css?v=1795789601">
<script src="assets/js/auth.js?v=1795770200"></script>
</head>
<body data-page="lesson">
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div><h1>一键备课</h1><p class="sub" data-page-sub>基于课程资料与学情，生成教案、课件、练习、答案与评分量规</p></div>
        <div class="right"><a class="btn" href="#packs">备课包历史</a></div>
      </div>

      <div class="ctx">
        <div><span class="k">当前课程</span><b data-fill="course.name">—</b></div>
        <div><span class="k">授课对象</span><b data-fill="course.classWithSize">—</b></div>
        <div><span class="k">进度</span><b data-fill="course.progress">—</b></div>
      </div>

      <div class="card" style="margin-bottom:14px">
        <div class="card-h"><h2>备课参数</h2><div class="right"><span class="tag acc">课程上下文已带入</span></div></div>
        <div class="card-b">
          <form data-sim="#lessonOut" data-msg="备课包已生成（示例）">
            <div class="grid g3">
              <div class="field" style="grid-column:span 2"><label>本次课题 *</label><input type="text" required value=""></div>
              <div class="field"><label>课型</label>
                <select><option>新课讲授</option><option>复习课</option><option>实训课</option><option>讨论课</option><option>翻转课堂</option></select>
              </div>
              <div class="field"><label>课时</label><input type="text" value=""></div>
              <div class="field" style="grid-column:span 2"><label>学生基础 / 能力水平</label><input type="text" value=""></div>
            </div>

            <div class="grid g2">
              <div class="field"><label>教学风格 / 课堂活动要求</label><textarea style="min-height:62px"></textarea></div>
              <div class="field"><label>补充要求</label><textarea style="min-height:62px"></textarea></div>
            </div>

            <div class="field">
              <label>输出物</label>
              <div class="checks" id="outChecks">
                <label class="chk on"><input type="checkbox" checked>教案</label>
                <label class="chk on"><input type="checkbox" checked>PPT</label>
                <label class="chk on"><input type="checkbox" checked>课堂练习</label>
                <label class="chk on"><input type="checkbox" checked>答案与解析</label>
                <label class="chk on"><input type="checkbox" checked>评分量规</label>
              </div>
            </div>

            <div class="field">
              <label>本次使用的课程资料</label>
              <div class="checks" id="docChecks"><span class="mini">加载中…</span></div>
              <span class="hint" id="docHint">按所选资料生成，未选则使用课程全部信息。</span>
            </div>

            <div class="grid g3">
              <div class="field"><label>生成模型</label><select data-model-select><option>智谱 GLM-4</option><option>智谱 GLM-4-Air</option></select></div>
              <div class="field"><label>审核模型</label><select data-model-select><option>智谱 GLM-4</option><option>智谱 GLM-4-Air</option></select></div>
              <div class="field"><label>一致性检查</label>
                <div class="checks" style="padding-top:4px"><label class="chk on"><input type="checkbox" checked>双模型一致性检查</label></div>
              </div>
            </div>

            <div class="form-actions">
              <button class="btn" type="submit">生成备课包</button>
              <button class="btn" type="reset">清空参数</button>
              <span class="mini">生成结果需教师审核后才可发布给学生。</span>
            </div>
          </form>
        </div>
      </div>

      <div class="card" id="lessonOut" hidden style="margin-bottom:14px">
        <div class="card-h"><h2>备课包</h2><div class="right"><button class="btn sm ghost" type="button" id="lessonCite">引用依据</button><span class="tag">暂无数据</span></div></div>
        <div class="card-b">
          <div class="rule" style="margin-bottom:12px">暂无数据</div>
          <div class="cite-box" id="lessonCiteBox" hidden>
            <div class="cite-h"><b>引用依据</b><span class="mini">—</span></div>
            <ul><li class="mini">暂无数据</li></ul>
            <div class="cite-meta"><span>生成模型：—</span><span>审核模型：—</span><span>生成时间：—</span></div>
          </div>
          <div class="tabs">
            <button class="on" data-tab="plan">教案</button>
            <button data-tab="ppt">课件 PPT</button>
            <button data-tab="drill">课堂练习</button>
            <button data-tab="key">答案与解析</button>
            <button data-tab="rubric">评分量规</button>
          </div>

          <div class="tabpane on" data-pane="plan">
            <h3>教学目标</h3>
            <div class="mini" style="padding:10px 0">暂无数据</div>
            <h3>教学流程</h3>
            <div class="stack" style="gap:8px"><div class="mini" style="padding:10px 0">暂无数据</div></div>
          </div>

          <div class="tabpane" data-pane="ppt">
            <div class="grid g2"><div class="mini" style="padding:10px 0">暂无数据</div></div>
          </div>

          <div class="tabpane" data-pane="drill">
            <div class="stack" style="gap:8px"><div class="mini" style="padding:10px 0">暂无数据</div></div>
          </div>

          <div class="tabpane" data-pane="key">
            <div class="stack" style="gap:8px"><div class="mini" style="padding:10px 0">暂无数据</div></div>
          </div>

          <div class="tabpane" data-pane="rubric">
            <div class="table-wrap">
              <table>
                <thead><tr><th>维度</th><th>分值</th><th>优秀标准</th><th>常见扣分</th></tr></thead>
                <tbody><tr><td colspan="4" class="mini">暂无数据</td></tr></tbody>
              </table>
            </div>
          </div>

          <div class="form-actions" style="margin-top:14px">
            <button class="btn" type="button" data-confirm="通过审核后，备课包将保存到当前课程资料并可用于课堂，确定继续？" data-demo="已保存到课程资料">通过审核并保存</button>
            <select id="lessonAudience" multiple size="2" title="发放班级：可多选，不选=全部班级"
                    style="width:132px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);font-size:12px;color:var(--text)">
              <option value="">全部班级</option>
            </select>
            <button class="btn" type="button" id="btnPublishLesson">发布给学生</button>
            <span class="tag" id="lessonPubTag">草稿</span>
            <button class="btn" type="button" id="btnGoRehearsal" style="background:var(--accent);color:#fff;border-color:var(--accent)">✦ 课堂预演</button>
            <button class="btn" type="button" data-demo="已重新生成一版">换一版</button>
            <button class="btn ghost" type="button" data-demo="已导出 Word（示例）">导出 Word</button>
            <span class="mini" id="rehearsalHint" style="color:var(--text-3);margin-left:6px"></span>
          </div>
        </div>
      </div>

      <div class="card" id="packs">
        <div class="card-h"><h2>备课包历史</h2><div class="right"><span class="mini" id="packCount">—</span></div></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>备课包</th><th>生成时间</th><th>模型</th><th>一致性</th><th>状态</th><th>操作</th></tr></thead>
            <tbody><tr><td colspan="6" class="mini">暂无数据</td></tr></tbody>
          </table>
        </div>
      </div>



    </main>
  </div>
</div>

<div class="toast"></div>
<script src="assets/js/data.js?v=1795420906"></script>
<script src="assets/js/site.js?v=1795789602"></script>
<script src="assets/js/api.js?v=1795770000"></script>
<script src="assets/js/live.js?v=1795789603"></script>
<script>
(function(){
  function $id(id){ return document.getElementById(id); }
  var form = document.querySelector('form[data-sim="#lessonOut"]');
  var citeBtn = $id("lessonCite"), citeBox = $id("lessonCiteBox");
  if (citeBtn && citeBox) citeBtn.addEventListener("click", function(){
    citeBox.hidden = !citeBox.hidden;
    if (!citeBox.hidden) citeBox.scrollIntoView({behavior:"smooth", block:"nearest"});
  });

  function syncOut(){
    document.querySelectorAll("#outChecks input").forEach(function(b){
      b.closest("label").classList.toggle("on", b.checked);
    });
  }

  document.addEventListener("change", function(e){
    if (e.target.closest && e.target.closest("#outChecks")) syncOut();
  });

  syncOut();
})();
</script>
</body>
</html>
