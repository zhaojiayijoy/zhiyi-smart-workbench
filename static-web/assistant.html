<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 助手 · 致壹 智能教育工作台</title>
<link rel="stylesheet" href="assets/css/site.css?v=1795799601">
<script src="assets/js/auth.js?v=1795770200"></script>
</head>
<body data-page="assistant">
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar"></header>
    <main class="content" style="max-width:none;display:flex;flex-direction:column">

      <div class="page-head">
        <div><h1>AI 助手</h1></div>
        <div class="right"><button class="btn" type="button" data-new-chat>新建对话</button></div>
      </div>

      <div style="display:flex;gap:14px;flex:1;min-height:calc(100vh - 200px)">
        <aside class="chat-history" id="chatHistory">
          <div class="ch-title"><b>对话历史</b><span class="mini" data-hist-count>—</span></div>
          <div class="ch-list" id="chatHistoryList"></div>
        </aside>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column">
          <div style="flex:1;min-height:0;overflow:auto;padding:4px 2px 12px">
            <div class="chat" id="chat">
              <div class="chat-empty" id="chatEmpty">
                <div class="ce-ic">✦</div>
                <b>今天想让 AI 帮你做什么？</b>
                <span>把知识点改写成课堂导入、按错误类型出练习题、压缩教案……直接输入即可。</span>
              </div>
            </div>
            <div class="checks" id="suggests" style="margin-top:12px">
              <button class="chk" type="button" data-prompt="生成一组区分参照群体与意见领袖的练习题">生成练习</button>
              <button class="chk" type="button" data-prompt="把第 6 次课的教案压缩成 45 分钟版本">压缩教案</button>
              <button class="chk" type="button" data-prompt="总结近 30 天学情中最需要干预的三个问题">总结学情</button>
            </div>
          </div>
          <div style="padding:12px 0 0">
            <form class="composer" id="composer">
              <textarea placeholder="输入问题，Enter 发送，Shift+Enter 换行" rows="2"></textarea>
              <button class="btn primary" type="submit">发送</button>
            </form>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<div class="toast"></div>
<script src="assets/js/data.js?v=1795420906"></script>
<script src="assets/js/site.js?v=1795799511"></script>
<script src="assets/js/api.js?v=1795799200"></script>
<script src="assets/js/live.js?v=1795799301"></script>
  <script src="assets/js/cursor.js" defer></script>
</body>
</html>
