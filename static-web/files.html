<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课程资源 · 致壹 智能教育工作台</title>
<link rel="stylesheet" href="assets/css/site.css?v=1795789601">
<script src="assets/js/auth.js?v=1795770200"></script>
</head>
<body data-page="files">
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div><h1>课程资源</h1><p class="sub">课程项目共用资料库，可设置教师可见或师生可见</p></div>
        <div class="right"><button class="btn primary" type="button" id="filesQuickUpload" title="定位到下方上传表单">＋ 上传资料</button></div>
      </div>

      <div class="grid g3" style="margin-bottom:14px">
        <div class="kpi"><div class="label">资料总数</div><div class="value">—</div><div class="foot">当前课程</div></div>
        <div class="kpi"><div class="label">已解析正文</div><div class="value">—</div><div class="foot">可用于备课检索</div></div>
        <div class="kpi"><div class="label">本地占用</div><div class="value">—</div><div class="foot">仅保存在本机</div></div>
      </div>

      <div class="card" id="fileUploadCard" style="margin-bottom:14px">
        <div class="card-h"><h2>上传资料</h2><div class="right"><span class="mini">PDF / DOCX / PPTX / XLSX / CSV / TXT</span></div></div>
        <div class="card-b">
          <form id="fileUploadForm" data-sim="#fileOut" data-msg="资料已加入课程">
            <div class="grid g3">
              <div class="field"><label>选择文件</label><input type="file" multiple></div>
              <div class="field"><label>资料类型</label><select><option>教材</option><option>课程标准</option><option>案例</option><option>课件</option><option>作业模板</option><option>表格</option></select></div>
              <div class="field"><label>可见范围</label><select><option>师生可见</option><option>教师可见</option><option>学生可见</option></select></div>
            </div>
            <div class="form-actions">
              <button class="btn" type="submit">加入当前课程</button>
              <span class="mini">支持 PDF / DOCX / PPTX / XLSX / CSV / TXT，单个文件不超过 50 MB。</span>
            </div>
          </form>
          <div class="rule" id="fileOut" hidden style="margin-top:12px">资料已加入课程，正文会作为备课与答疑的检索依据。</div>
        </div>
      </div>

      <div class="card">
        <div class="card-h">
          <h2>全部资料</h2>

        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>文件名</th><th>类型</th><th>大小</th><th>解析结果</th><th>可见范围</th><th>加入时间</th><th></th></tr></thead>
            <tbody>
              <tr><td colspan="7" class="mini">暂无数据</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<div class="toast"></div>
<script src="assets/js/data.js?v=1795420906"></script>
<script src="assets/js/site.js?v=1795789602"></script>
<script src="assets/js/api.js?v=1795770000"></script>
<script src="assets/js/live.js?v=1795789603"></script>
</body>
</html>
