<script>
(function(){
  var form = document.getElementById('homeComposer');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var ta = form.querySelector('textarea');
    var text = ta.value.trim();
    if (!text) { ta.focus(); return; }
    location.href = 'assistant.html?q=' + encodeURIComponent(text);
  });
  form.querySelector('textarea').addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); form.dispatchEvent(new Event('submit')); }
  });
})();
</script>
<script>
/* ===== 新建教学任务：自动打包当前项目，并以当前项目名称创建新一轮 =====
   入口在左侧栏「＋ 新建教学任务」按钮（任意页面点击都会回到本页弹窗）。 */
(function(){
  "use strict";

  var mask = document.getElementById('newTaskModal');
  var intro = document.getElementById('ntIntro');
  var rule = document.getElementById('ntRule');
  var stateEl = document.getElementById('ntState');
  var confirmBtn = document.getElementById('ntConfirm');

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function cur(){
    return (window.Edu && Edu.getSelectedCourse) ? Edu.getSelectedCourse() : null;
  }

  function liveReady(){
    return !!(window.Edu && Edu.isLive() && window.EduAPI &&
      EduAPI.courses && typeof EduAPI.courses.archiveRound === "function");
  }

  function syncPick(list){
    var pick = document.getElementById('coursePick');
    if (!pick) return;
    var arr = (list && list.length) ? list : (Edu.state.courses || []);
    pick.innerHTML = arr.map(function(c){
      return '<option value="' + c.id + '">' + esc(c.name) +
        (c.class ? " · " + esc(c.class) : "") + '</option>';
    }).join("") || '<option value="">（暂无课程）</option>';
    if (Edu.state.selectedCourseId) pick.value = String(Edu.state.selectedCourseId);
  }

  function openModal(){
    var c = cur();
    if (!c){ toast("请先创建或选择课程项目"); return; }
    if (!liveReady()){ toast("未连接本地接口，无法自动打包当前项目"); return; }
    var name = c.name || "未命名课程";
    intro.textContent = "当前项目：" + name;
    rule.textContent = "确认后会把「" + name + "」的当前项目自动打包归档为历史轮次，并以「" + name +
      "」为新项目名称创建新一轮教学任务；课程档案、教学资料与教学进度都会保留，历史轮次可在「课程项目」中查看。";
    stateEl.textContent = "";
    confirmBtn.disabled = false;
    confirmBtn.textContent = "打包并新建任务";
    mask.classList.add("on");
  }

  function closeModal(){ mask.classList.remove("on"); }

  function doArchive(){
    var c = cur();
    if (!c) return;
    confirmBtn.disabled = true;
    confirmBtn.innerHTML = '<span class="spin"></span> 打包中…';
    stateEl.textContent = "正在打包当前项目并创建新一轮…";
    EduAPI.courses.archiveRound(c.id, {}).then(function(res){
      var next = (res && res.next) || null;
      return EduAPI.courses.list().then(function(list){
        Edu.state.courses = list || [];
        if (next && next.id){
          Edu.selectCourse(next.id);
          syncPick(list);
          closeModal();
          toast("已打包当前项目，并创建「" + (next.name || c.name || "新项目") + "」新一轮");
        } else {
          closeModal();
          toast("当前项目已打包归档");
        }
        // 新建教学任务后自动跳转到课程项目页面
        setTimeout(function(){ location.href = "courses.html"; }, 400);
      });
    }).catch(function(err){
      stateEl.textContent = "打包失败：" + (err && err.message ? err.message : err);
      confirmBtn.disabled = false;
      confirmBtn.textContent = "重试打包并新建";
    });
  }

  window.EduNewTask = { open: openModal };

  confirmBtn.addEventListener('click', doArchive);
  mask.addEventListener('click', function(e){
    if (e.target === mask || e.target.closest('[data-nt-close]')) closeModal();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeModal();
  });

  // 从其它页面点击侧栏「新建教学任务」跳回本页时自动打开弹窗
  if (location.hash === '#newTask'){
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    setTimeout(openModal, 200);
  }
})();
</script>
