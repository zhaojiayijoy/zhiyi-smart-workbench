<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<div class="app">

  <div class="main">

        <form class="composer" id="homeComposer">

          <button class="btn primary" type="submit">发送</button>
        </form>

        <div class="hero-quick">
          <div class="hero-quick-h"><span>教学功能 · 选择一项开始</span></div>
          <div class="quick">
            <a href="lesson.html"><span class="qi">✦</span><span><b>一键备课</b><span>生成教案、PPT、练习和评分标准</span></span></a>
            <a href="training.html"><span class="qi">◈</span><span><b>创建实训</b><span>生成 Word、Excel、PPT 实训任务</span></span></a>
            <a href="tutor.html"><span class="qi">◌</span><span><b>学生答疑</b><span>提供引导式提示并汇总错因</span></span></a>
            <a href="review.html"><span class="qi">✓</span><span><b>作业评审</b><span>AI 初评、证据定位和教师复核</span></span></a>
            <a href="files.html"><span class="qi">▤</span><span><b>课程资源</b><span>管理教材、课件、案例和学生资料</span></span></a>
            <a href="analytics.html"><span class="qi">◔</span><span><b>学情分析</b><span>查看薄弱知识点和下一课建议</span></span></a>
          </div>
        </div>
      </section>

      <div class="card">
        <div class="card-h"><h2>最近动态</h2><div class="right"><span class="mini">最近 30 天</span></div></div>
        <div class="card-b tight">
          <div class="recent-grid" style="margin:0;gap:16px">
            <div>
              <div class="recent-h"><b>最近备课包</b><a class="mini" href="lesson.html">全部</a></div>
              <div class="mini" style="padding:8px 0">暂无数据</div>
            </div>
            <div>
              <div class="recent-h"><b>最近实训任务</b><a class="mini" href="training.html">全部</a></div>
              <div class="mini" style="padding:8px 0">暂无数据</div>
            </div>
            <div>
              <div class="recent-h"><b>待评审作业</b><a class="mini" href="review.html">全部</a></div>
              <div class="mini" style="padding:8px 0">暂无数据</div>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<div class="modal-mask" id="newTaskModal">
  <div class="modal" style="max-width:520px">
    <div class="modal-h"><b>新建教学任务</b><button class="x" type="button" data-nt-close>×</button></div>
    <div class="modal-b">
      <p class="sub" id="ntIntro">—</p>
      <div class="rule" id="ntRule" style="margin-top:10px">—</div>
      <div class="mini" id="ntState" style="margin-top:10px"></div>
    </div>
    <div class="modal-f">
      <button class="btn" type="button" data-nt-close>取消</button>
      <button class="btn primary" type="button" id="ntConfirm">打包并新建任务</button>
    </div>
  </div>
</div>

<div class="toast"></div>

<script src="assets/js/data.js?v=1795420906"></script>
<script src="assets/js/site.js?v=1795700060"></script>
<script src="assets/js/api.js?v=1795700003"></script>
<script src="assets/js/live.js?v=1795700004"></script>
<script>
(function(){
  var form = document.getElementById('homeComposer');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var text = form.querySelector('textarea').value.trim();
    location.href = 'assistant.html' + (text ? '?q=' + encodeURIComponent(text) : '');
  });
  form.querySelector('textarea').addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); form.dispatchEvent(new Event('submit')); }
  });
})();
</script>
<script>
/* ===== 新建教学任务：自动打包当前项目，并以当前项目名称创建新一轮 =====
   入口在左侧栏「＋ 新建教学任务」按钮（任意页面点击都会回到本页弹窗）。 */
(function(){
  "use strict";

  var mask = document.getElementById('newTaskModal');
  var intro = document.getElementById('ntIntro');
  var rule = document.getElementById('ntRule');
  var stateEl = document.getElementById('ntState');
  var confirmBtn = document.getElementById('ntConfirm');

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function cur(){
    return (window.Edu && Edu.getSelectedCourse) ? Edu.getSelectedCourse() : null;
  }

  function liveReady(){
    return !!(window.Edu && Edu.isLive() && window.EduAPI &&
      EduAPI.courses && typeof EduAPI.courses.archiveRound === "function");
  }

  function syncPick(list){
    var pick = document.getElementById('coursePick');
    if (!pick) return;
    var arr = (list && list.length) ? list : (Edu.state.courses || []);
    pick.innerHTML = arr.map(function(c){
      return '<option value="' + c.id + '">' + esc(c.name) +
        (c.class ? " · " + esc(c.class) : "") + '</option>';
    }).join("") || '<option value="">（暂无课程）</option>';
    if (Edu.state.selectedCourseId) pick.value = String(Edu.state.selectedCourseId);
  }

  function openModal(){
    var c = cur();
    if (!c){ toast("请先创建或选择课程项目"); return; }
    if (!liveReady()){ toast("未连接本地接口，无法自动打包当前项目"); return; }
    var name = c.name || "未命名课程";
    intro.textContent = "当前项目：" + name;
    rule.textContent = "确认后会把「" + name + "」的当前项目自动打包归档为历史轮次，并以「" + name +
      "」为新项目名称创建新一轮教学任务；课程档案、教学资料与教学进度都会保留，历史轮次可在「课程项目」中查看。";
    stateEl.textContent = "";
    confirmBtn.disabled = false;
    confirmBtn.textContent = "打包并新建任务";
    mask.classList.add("on");
  }

  function closeModal(){ mask.classList.remove("on"); }

  function doArchive(){
    var c = cur();
    if (!c) return;
    confirmBtn.disabled = true;
    confirmBtn.innerHTML = '<span class="spin"></span> 打包中…';
    stateEl.textContent = "正在打包当前项目并创建新一轮…";
    EduAPI.courses.archiveRound(c.id, {}).then(function(res){
      var next = (res && res.next) || null;
      return EduAPI.courses.list().then(function(list){
        Edu.state.courses = list || [];
        if (next && next.id){
          Edu.selectCourse(next.id);
          syncPick(list);
          closeModal();
          toast("已打包当前项目，并创建「" + (next.name || c.name || "新项目") + "」新一轮");
        } else {
          closeModal();
          toast("当前项目已打包归档");
        }
      });
    }).catch(function(err){
      stateEl.textContent = "打包失败：" + (err && err.message ? err.message : err);
      confirmBtn.disabled = false;
      confirmBtn.textContent = "重试打包并新建";
    });
  }

  window.EduNewTask = { open: openModal };

  confirmBtn.addEventListener('click', doArchive);
  mask.addEventListener('click', function(e){
    if (e.target === mask || e.target.closest('[data-nt-close]')) closeModal();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeModal();
  });

  // 从其它页面点击侧栏「新建教学任务」跳回本页时自动打开弹窗
  if (location.hash === '#newTask'){
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    setTimeout(openModal, 200);
  }
})();
</script>
</body>
</html>
