<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>作业评审 · 致壹 智能教育工作台</title>
<link rel="stylesheet" href="assets/css/site.css?v=1795799601">
<script src="assets/js/auth.js?v=1795770200"></script>
</head>
<body data-page="review">
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div><h1>作业评审</h1></div>
        <div class="right" id="reviewHeadTags"><span class="tag warn">— 份待复核</span><span class="tag ok">— 份已发布</span></div>
      </div>

      <div class="ctx">
        <div><span class="k">当前课程</span><b data-fill="course.name">—</b></div>
        <div><span class="k">授课对象</span><b data-fill="course.classWithSize">—</b></div>
        <div><span class="k">进度</span><b data-fill="course.progress">—</b></div>
      </div>

      <div class="card" style="margin-bottom:14px" data-panel="上传学生提交" data-panel-width="820px" data-panel-ic="↑">
        <div class="card-b">
          <div class="steps" id="reviewSteps">
            <span class="step" data-step="1"><i>1</i>AI 评审</span><span class="arw">→</span>
            <span class="step" data-step="2"><i>2</i>教师复核</span><span class="arw">→</span>
            <span class="step" data-step="3"><i>3</i>发布成绩</span>
          </div>
          <form data-sim="#reviewOut" data-msg="已开始评审（示例）">
            <div class="field">
              <label>学生提交文件</label>
              <div class="dropzone" id="dz" tabindex="0" role="button" aria-label="拖拽或点击上传学生提交文件">
                <div class="dz-ic">↑</div>
                <div class="dz-t">拖拽文件到此处，或点击选择</div>
                <div class="dz-s">支持 docx / xlsx / pdf / pptx；同一名学生可一次上传多个文件</div>
              </div>
              <input type="file" id="dzInput" multiple accept=".docx,.xlsx,.xls,.pdf,.pptx" hidden>
              <div class="dz-files" id="dzFiles"></div>
            </div>
            <div class="grid g2">
              <div class="field"><label>学生姓名</label><input type="text" placeholder="例如：陈思远"></div>
              <div class="field"><label>班级</label><input type="text" data-fill="course.class" placeholder="自动带入当前课程班级"></div>
            </div>
            <div class="field"><label>评分量规</label>
              <select id="rubricPick"><option value="">默认量规（内容 / 数据 / 表达 / 可行性）</option></select>
            </div>
            <div class="form-actions">
              <button class="btn primary" type="submit">开始评审</button>
              <button class="btn" type="reset">清空</button>
              <span class="mini">评审结果需教师逐项确认后才计入成绩。</span>
            </div>
          </form>
          <div class="rule" id="reviewOut" hidden style="margin-top:12px">暂无数据</div>
        </div>
      </div>

      <div class="split" style="margin-bottom:14px">
        <div class="card">
          <div class="card-h"><h2>学生提交</h2><div class="right"><span class="mini" id="reviewSubmitCount">—</span></div></div>
          <div class="card-b">
            <div class="row"><span class="mini" id="reviewSelectedCount">已选 0 份</span><button class="btn sm" type="button" id="reviewBatchPublish" disabled>批量发布</button><button class="btn sm" type="button" id="reviewBatchReturn" disabled>批量退回</button></div>
            <div class="grid g2">
              <div class="field"><label for="reviewBatchReason">退回原因（退回时必填）</label><textarea id="reviewBatchReason" rows="2"></textarea></div>
              <div class="field"><label for="reviewBatchComment">批量评语（可选）</label><textarea id="reviewBatchComment" rows="2"></textarea></div>
            </div>
            <div class="mini" id="reviewBatchResult" role="status" aria-live="polite" style="white-space:pre-wrap"></div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th><input type="checkbox" id="reviewSelectAll" aria-label="全选评审记录"></th><th>学生</th><th>文件</th><th>总分</th><th>状态</th></tr></thead>
              <tbody id="reviewHistoryTb"><tr><td colspan="5" class="mini">暂无数据</td></tr></tbody>
            </table>
          </div>
          <div class="card-b" style="border-top:1px solid var(--line)">
            <div class="mini">正在查看：<b id="reviewViewing" style="color:var(--text)">暂无数据</b></div>
            <h3>提交版本历史</h3>
            <div id="reviewVersions" class="stack" aria-live="polite"><div class="mini">请选择评审记录</div></div>
          </div>
        </div>

        <div class="card" data-panel="分维度评分证据" data-panel-width="860px" data-panel-ic="◫">
          <div class="card-h"><h2>分维度评分证据</h2><div class="right"><span class="tag acc" id="reviewAiScore">AI 初评 —</span></div></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>维度</th><th>得分</th><th>依据 / 扣分原因</th><th>位置</th><th>采纳</th></tr></thead>
              <tbody id="reviewEvidenceTb"><tr><td colspan="5" class="mini">暂无数据</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card" data-panel="教师复核与终评" data-panel-width="820px" data-panel-ic="✓">
        <div class="card-b">
          <form data-sim="#finalOut" data-msg="教师终评已保存（示例）">
            <div class="grid g4">
              <div class="field"><label>理论应用</label><input type="number" value="" max="30"></div>
              <div class="field"><label>数据支撑</label><input type="number" value="" max="25"></div>
              <div class="field"><label>方案可行性</label><input type="number" value="" max="25"></div>
              <div class="field"><label>表达规范</label><input type="number" value="" max="20"></div>
            </div>
            <div class="field"><label>终评评语</label><textarea style="min-height:80px"></textarea></div>
            <div class="form-actions">
              <button class="btn" type="submit" data-confirm="保存后该学生成绩将按终评计入课程，确定保存？">保存教师终评</button>
              <button class="btn" type="button" data-demo="已退回给学生修改">退回修改</button>
              <button class="btn ghost" type="button">需要人工检查</button>
              <span class="mini">总计 <b id="reviewFinalTotal">—</b> / 100</span>
            </div>
          </form>
          <div class="rule" id="finalOut" hidden style="margin-top:12px">暂无数据</div>
        </div>
      </div>

    </main>
  </div>
</div>

<div class="toast"></div>
<script>
(function(){
  var dz = document.getElementById("dz");
  var input = document.getElementById("dzInput");
  var list = document.getElementById("dzFiles");
  var files = [];

  function render(){
    list.innerHTML = "";
    files.forEach(function(f, idx){
      var row = document.createElement("div");
      row.className = "dz-file";
      var nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = f.name;
      var sz = document.createElement("span");
      sz.className = "mini";
      sz.textContent = Math.max(1, Math.round(f.size / 1024)) + " KB";
      var rm = document.createElement("button");
      rm.type = "button";
      rm.className = "btn sm ghost";
      rm.textContent = "移除";
      rm.addEventListener("click", function(){ files.splice(idx, 1); render(); });
      row.appendChild(nm); row.appendChild(sz); row.appendChild(rm);
      list.appendChild(row);
    });
    syncInput();
  }
  function syncInput(){
    if (!input) return;
    try {
      var dt = new DataTransfer();
      files.forEach(function(f){ dt.items.add(f); });
      input.files = dt.files;
    } catch (e) {}
  }
  function addFiles(fl){
    Array.prototype.forEach.call(fl, function(f){ files.push(f); });
    render();
  }
  if (dz && input && list){
    dz.addEventListener("click", function(){ input.click(); });
    dz.addEventListener("keydown", function(e){
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); input.click(); }
    });
    input.addEventListener("change", function(){ addFiles(input.files); });
    ["dragenter","dragover"].forEach(function(ev){
      dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.add("drag"); });
    });
    ["dragleave","drop"].forEach(function(ev){
      dz.addEventListener(ev, function(e){ e.preventDefault(); dz.classList.remove("drag"); });
    });
    dz.addEventListener("drop", function(e){
      if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
    });
  }

  var steps = document.querySelectorAll("#reviewSteps .step");
  function setStage(stage){
    Array.prototype.forEach.call(steps, function(s){
      var n = parseInt(s.getAttribute("data-step"), 10);
      s.classList.remove("done", "cur");
      var ic = s.querySelector("i");
      if (n < stage){ s.classList.add("done"); if (ic) ic.textContent = "✓"; }
      else if (n === stage){ s.classList.add("cur"); if (ic) ic.textContent = String(n); }
      else if (ic) ic.textContent = String(n);
    });
  }
  var f1 = document.querySelector('form[data-sim="#reviewOut"]');
  if (f1) f1.addEventListener("submit", function(){ setStage(2); });
  // 初始状态：未上传任何提交前不点亮任何步骤，避免"已完成"的误导
  setStage(0);
  var f2 = document.querySelector('form[data-sim="#finalOut"]');
  if (f2) f2.addEventListener("submit", function(){
    Array.prototype.forEach.call(steps, function(s){
      s.classList.remove("cur"); s.classList.add("done");
      var ic = s.querySelector("i"); if (ic) ic.textContent = "✓";
    });
  });
})();
</script>
<script src="assets/js/data.js?v=1795420906"></script>
<script src="assets/js/site.js?v=1795799511"></script>
<script src="assets/js/api.js?v=1795799200"></script>
<script src="assets/js/live.js?v=1795799301"></script>
</body>
</html>
