<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学情分析 · 致壹 智能教育工作台</title>
<link rel="stylesheet" href="assets/css/site.css?v=1795700080">
</head>
<body data-page="analytics">
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div><h1>学情分析</h1><p class="sub" data-page-sub>把答疑、评审与实训数据汇总为可执行的教学决策</p></div>
        <div class="right">
          <button class="btn" type="button" title="导出报告">导出报告</button>
          <a class="btn" href="lesson.html">带入备课本</a>
        </div>
      </div>

      <div class="ctx">
        <div><span class="k">当前课程</span><b data-fill="course.name">—</b></div>
        <div><span class="k">授课对象</span><b data-fill="course.classWithSize">—</b></div>
        <div><span class="k">进度</span><b data-fill="course.progress">—</b></div>
      </div>

      <div class="card" style="margin-bottom:14px">
        <div class="card-b" style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end">
          <div class="field" style="margin:0;min-width:130px"><label>时间范围</label>
            <select id="anaDays"><option value="7">近 7 天</option><option value="30" selected>近 30 天</option><option value="">全部</option></select>
          </div>
          <div class="field" style="margin:0;min-width:190px"><label>知识点</label>
            <input type="text" id="anaKp" placeholder="按知识点过滤，可留空">
          </div>
          <div class="field" style="margin:0"><label>数据来源</label>
            <div class="checks" id="anaSrc">
              <label class="chk on"><input type="checkbox" value="答疑" checked>答疑</label>
              <label class="chk on"><input type="checkbox" value="评审" checked>评审</label>
              <label class="chk on"><input type="checkbox" value="实训" checked>实训</label>
            </div>
          </div>
          <span style="flex:1"></span>
          <button class="btn" type="button" data-demo="筛选已应用">应用筛选</button>
        </div>
      </div>

      <div class="grid g4" style="margin-bottom:14px">
        <div class="kpi"><div class="label">答疑记录</div><div class="value">—</div><div class="foot">—</div></div>
        <div class="kpi"><div class="label">作业评审</div><div class="value">—</div><div class="foot">—</div></div>
        <div class="kpi warn"><div class="label">建议重点支持</div><div class="value">—</div><div class="foot">均分 &lt; 60</div></div>
        <div class="kpi ok"><div class="label">建议提供拓展任务</div><div class="value">—</div><div class="foot">均分 ≥ 85</div></div>
      </div>

      <div class="card" style="margin-bottom:14px">
        <div class="card-b" style="padding-bottom:6px">
          <div class="tabs">
            <button class="on" data-tab="points">高频知识点</button>
            <button data-tab="errors">错误类型占比</button>
            <button data-tab="dims">能力维度均分</button>
            <button data-tab="supports">学习支持建议</button>
          </div>

          <div class="tabpane on" data-pane="points">
            <div class="bars"></div>
            <div class="state is-empty" data-barempty hidden>
              <div class="state-ic">◌</div>
              <div><b>暂无可用数据</b><span>当前课程还没有答疑或评审记录，生成后即可查看分布。</span></div>
              <div class="state-actions">
                <button class="btn sm" type="button" data-demo="已重新拉取数据（示例）">重新加载</button>
                <a class="btn sm" href="lesson.html">先备课</a>
              </div>
            </div>
            <div class="evidence" data-evbox></div>
            <div class="rule clickable" id="pointsConclusion" style="margin-top:14px" data-ev="暂无数据">暂无数据</div>
          </div>

          <div class="tabpane" data-pane="errors">
            <div class="table-wrap">
              <table>
                <thead><tr><th>错误类型</th><th>占比</th><th>说明</th><th>建议</th></tr></thead>
                <tbody>
                  <tr><td colspan="4" class="mini">暂无数据</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="tabpane" data-pane="dims">
            <div class="bars"></div>
            <div class="state is-empty" data-barempty hidden>
              <div class="state-ic">◌</div>
              <div><b>暂无可用数据</b><span>当前课程还没有答疑或评审记录，生成后即可查看分布。</span></div>
              <div class="state-actions">
                <button class="btn sm" type="button" data-demo="已重新拉取数据（示例）">重新加载</button>
                <a class="btn sm" href="lesson.html">先备课</a>
              </div>
            </div>
            <div class="evidence" data-evbox></div>
            <div class="rule" id="dimsConclusion" style="margin-top:14px">暂无数据</div>
          </div>

          <div class="tabpane" data-pane="supports">
            <div class="stack" style="gap:8px">
              <div class="mini" style="padding:10px 0">暂无数据</div>
            </div>
          </div>
        </div>
      </div>

      <div class="split">
        <div class="card" id="actionCenter">
          <div class="card-h"><h2>下一课行动中心</h2><div class="right"><span class="tag acc" id="actionLessonTag">—</span></div></div>
          <div class="card-b">
            <div class="stack" id="weakStack" style="gap:6px;margin-bottom:14px">
              <div class="mini" style="padding:10px 0">点击「应用筛选」生成下一课方案</div>
            </div>
            <div class="form-actions">
              <a class="btn" href="lesson.html">带入下一课备课</a>
              <button class="btn" type="button" data-confirm="将根据本次学情生成讲评课 PPT，确定继续？" data-demo="讲评课 PPT 已生成并加入备课包">生成讲评课 PPT</button>
            </div>
          </div>
        </div>

        <div class="card fold">
          <div class="card-h" data-fold-head aria-expanded="false"><h2>数据来源</h2><div class="right"><span class="mini">近 30 天</span><span class="fold-caret">▾</span></div></div>
          <div class="card-b">
            <div class="bars">
              <div class="mini" style="padding:10px 0">暂无数据</div>
            </div>
            <div class="hr"></div>
            <p class="mini" style="margin:0">所有统计仅使用当前课程与当前班级的数据，不上传到外部服务。</p>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<div class="toast"></div>
<script>
/* 条形图宽度由真实数据渲染 */

/* 点击柱状图 / 知识点 / 结论，查看证据（兼容 live.js 动态渲染的条形） */
(function(){
  document.querySelectorAll(".tabpane").forEach(function(pane){
    var box = pane.querySelector("[data-evbox]");
    if (!box) return;
    pane.addEventListener("click", function(e){
      var el = e.target.closest(".bar-row, .rule.clickable");
      if (!el) return;
      var ev = el.getAttribute("data-ev");
      if (!ev){
        var t = el.querySelector(".t");
        var label = t && t.querySelector("b") ? t.querySelector("b").textContent : "";
        var val = t && t.querySelector("span") ? t.querySelector("span").textContent : "";
        ev = (label || "该项") + (val ? "（" + val + "）" : "") + "：数据来自当前课程近 30 天的答疑与评审记录。";
      }
      box.textContent = ev;
      box.classList.add("on");
      if (!box.querySelector(".cite-box")) box.insertAdjacentHTML("beforeend",
        '<div class="cite-box" style="margin-top:8px"><div class="mini">暂无引用依据</div></div>');
    });
  });
})();

/* 无数据状态：条形区域为空时显示 */
(function(){
  function check(){
    Array.prototype.forEach.call(document.querySelectorAll(".tabpane"), function(pane){
      var bars = pane.querySelector(".bars");
      var st = pane.querySelector("[data-barempty]");
      if (!bars || !st) return;
      var has = !!bars.querySelector(".bar-row");
      bars.style.display = has ? "" : "none";
      st.hidden = has;
    });
  }
  check();
  if (window.MutationObserver){
    Array.prototype.forEach.call(document.querySelectorAll(".bars"), function(b){
      new MutationObserver(check).observe(b, { childList: true });
    });
  }
  setTimeout(check, 1200);
})();
</script>
<script src="assets/js/data.js?v=1795420906"></script>
<script src="assets/js/site.js?v=1795700060"></script>
<script src="assets/js/api.js?v=1795700003"></script>
<script src="assets/js/live.js?v=1795700005"></script>
</body>
</html>
