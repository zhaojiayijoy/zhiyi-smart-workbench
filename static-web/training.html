<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>创建实训 · 致壹 智能教育工作台</title>
<link rel="stylesheet" href="assets/css/site.css?v=1795700180">
<script src="assets/js/auth.js?v=1795770200"></script>
</head>
<body data-page="training">
<div class="app">
  <aside class="sidebar"></aside>
  <div class="main">
    <header class="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div><h1>创建实训</h1><p class="sub" data-page-sub>用真实工作场景生成任务包，覆盖 Excel、Word、PPT 与数据分析要求</p></div>
        <div class="right"><a class="btn" href="#taskList">任务列表</a></div>
      </div>

      <div class="ctx">
        <div><span class="k">当前课程</span><b data-fill="course.name">—</b></div>
        <div><span class="k">授课对象</span><b data-fill="course.classWithSize">—</b></div>
        <div><span class="k">进度</span><b data-fill="course.progress">—</b></div>
      </div>

      <div class="card" style="margin-bottom:14px">
        <div class="card-h"><h2>场景描述</h2><div class="right"><span class="tag acc">关联：<b data-fill="course.name">—</b></span></div></div>
        <div class="card-b">
          <form data-sim="#trainOut" data-msg="实训任务包已生成">
            <div class="field">
              <label>场景模板</label>
              <div class="checks" id="tplBar"></div>
              <span class="hint" id="tplHint">选择模板可快速填入场景，可继续修改。</span>
            </div>
            <div class="field">
              <label>真实工作场景 *</label>
              <textarea id="trainScenario" required style="min-height:84px"></textarea>
              <span class="hint">写清岗位、交付物与时间要求，生成结果会更贴近真实工作。</span>
            </div>
            <div class="field">
              <label>补充要求</label>
              <textarea id="trainExtra" style="min-height:60px"></textarea>
            </div>
            <div class="form-actions">
              <button class="btn primary" type="submit">生成实训任务包</button>
              <button class="btn" type="reset">清空</button>
              <span class="mini">生成后会出现在下方任务列表，可编辑后发布。</span>
            </div>
          </form>
        </div>
      </div>

      <div class="card" id="trainOut" hidden style="margin-bottom:14px">
        <div class="card-h"><h2 id="trainTitle">任务包：暂无数据</h2><div class="right"><span class="tag">—</span><span class="tag acc">—</span></div></div>
        <div class="card-b">
          <div class="grid g2">
            <div id="trainColA"><div class="mini" style="padding:10px 0">暂无数据</div></div>
            <div id="trainColB"><div class="mini" style="padding:10px 0">暂无数据</div></div>
          </div>
          <div id="trainRubric" style="margin-top:14px"></div>
          <div class="form-actions" style="margin-top:14px">
            <select id="trainAudience" multiple size="2" title="发放班级：可多选，不选=全部班级"
                    style="width:132px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);font-size:12px;color:var(--text)">
              <option value="">全部班级</option>
            </select>
            <button class="btn" type="button" data-confirm="发布后学生即可查看并提交任务，确定发布？" data-demo="任务已发布到学生空间">发布任务</button>
            <button class="btn" type="button" data-demo="已保存为草稿">保存草稿</button>
            <button class="btn ghost" type="button" data-demo="已导出任务说明（示例）">导出任务说明</button>
          </div>
        </div>
      </div>

      <div class="card" id="taskList">
        <div class="card-h">
          <h2>实训任务</h2>
          <div class="right" style="gap:8px">
            <input type="search" id="taskSearch" placeholder="搜索任务名称" aria-label="搜索任务"
                   style="width:150px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);font-size:12px;color:var(--text)">
            <select id="taskStatus" aria-label="按状态筛选"
                    style="width:auto;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);font-size:12px;color:var(--text)">
              <option value="">全部状态</option>
              <option value="published">已发布</option>
              <option value="draft">草稿</option>
              <option value="closed">已关闭</option>
            </select>
            <span class="mini" id="taskCount">—</span>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>任务</th><th>状态</th><th>任务总分</th><th>提交情况</th><th>创建时间</th><th>操作</th></tr></thead>
            <tbody id="taskTbody"><tr><td colspan="6" class="mini">暂无数据</td></tr></tbody>
          </table>
        </div>
      </div>

      <script>
      (function(){
        var tb = document.getElementById("taskTbody");
        if (!tb) return;
        var search = document.getElementById("taskSearch");
        var filter = document.getElementById("taskStatus");
        var countEl = document.getElementById("taskCount");

        function rows(){ return Array.prototype.slice.call(tb.querySelectorAll("tr")).filter(function(tr){ return tr.cells.length >= 6; }); }

        function applyFilter(){
          var q = (search.value || "").trim().toLowerCase();
          var st = filter.value;
          var shown = 0;
          rows().forEach(function(tr){
            var name = (tr.cells[0].textContent || "").toLowerCase();
            var ok = (!q || name.indexOf(q) > -1) && (!st || tr.getAttribute("data-status") === st);
            tr.style.display = ok ? "" : "none";
            if (ok) shown++;
          });
          countEl.textContent = shown + " 个";
        }

        search.addEventListener("input", applyFilter);
        filter.addEventListener("change", applyFilter);
      })();

      </script>

    </main>
  </div>
</div>

<div class="toast"></div>
<script src="assets/js/data.js?v=1795420906"></script>
<script src="assets/js/site.js?v=1795766000"></script>
<script src="assets/js/api.js?v=1795770000"></script>
<script src="assets/js/live.js?v=1795770400"></script>
</body>
</html>
